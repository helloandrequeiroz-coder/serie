<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0D">
<title>#VemMonstro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" as="image" href="icons/logo.webp">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VemMonstro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* #VemMonstro v8 — escuro, Helvetica, só cinza + vermelho. Números grandes, alvos grandes, uma cor de ação. */
:root{
  --bg:#0C0C0D; --card:#18181A; --card2:#232326; --card3:#2E2E32; --ink:#F5F5F7; --soft:#9C9CA3; --mute:#6B6B72; --line:#26262A; --paper:#0C0C0D;
  --g:#FF3B30; --g2:#FF6A61; --g3:#FF8A82; --mint:rgba(255,59,48,.14); --ok:#FF3B30; --red:#FF3B30;
  --display:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  --r:26px; --sh:none;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;color-scheme:dark}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.3}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(8px + var(--safe-t)) 0 calc(104px + var(--safe-b));position:relative}
.wrap{padding:0 16px}
svg{flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px;min-height:58px}
.hd-r{display:flex;gap:8px;align-items:center}
.icb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.icb svg{width:22px;height:22px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 16px;border-radius:999px;background:var(--card2);font-weight:600;font-size:15px}
.chipbtn svg{width:18px;height:18px}
.ph{padding:4px 20px 18px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(34px,9.5vw,44px);line-height:1.02;margin:0;letter-spacing:-.025em;text-wrap:balance}
.lead{font-size:16px;color:var(--soft);margin:8px 0 0}
.home-hd{padding:10px 16px 16px}
.hello{display:flex;gap:12px;align-items:center}
.hello small{display:block;color:var(--soft);font-size:15px}
.hello b{font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.logo-sm{width:50px;height:50px;object-fit:contain}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--card2);color:var(--ink);font-weight:700;font-size:18px}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:12px}
.t,.h2{display:block;font-weight:700;font-size:18px;margin:0 0 14px;letter-spacing:-.01em}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:22px;letter-spacing:-.02em;margin:26px 4px 12px}
.sec-t small{font-size:15px;font-weight:500;color:var(--soft);letter-spacing:0}
.row-b{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.row-b .t{margin:0}
.row-b>svg{width:20px;height:20px;color:var(--mute)}
.pill2{font-size:14px;font-weight:600;background:var(--card2);color:var(--ink);padding:6px 12px;border-radius:999px}
.pill2.on{background:var(--g);color:#fff}
/* hero: treino de hoje */
.hero{position:relative;background:var(--card);border-radius:30px;padding:0;margin-bottom:12px;overflow:hidden}
.hero-media{position:relative;height:210px;background:var(--card2);overflow:hidden}
.hero-media .anim img{object-fit:cover;filter:grayscale(1) contrast(1.05)}
.hero-media::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,24,26,0) 45%,var(--card) 100%)}
.hero-body{padding:4px 20px 20px;position:relative}
.hero small{display:block;font-size:14px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.hero h2{font-weight:700;font-size:36px;line-height:1;margin:8px 0 12px;letter-spacing:-.03em}
.hero p{margin:0 0 18px;color:var(--soft);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tags span{font-size:14px;font-weight:600;background:var(--card2);border-radius:999px;padding:7px 12px;color:var(--ink)}
.tags span.r{background:var(--mint);color:var(--g2)}
.playbtn{position:absolute;right:18px;top:-38px;width:76px;height:76px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(255,59,48,.45);z-index:2}
.playbtn svg{width:34px;height:34px}
.playbtn::before,.playbtn::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--g);z-index:-1;animation:pulse 1.8s ease-out infinite}
.playbtn::after{animation-delay:.9s}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.hero.live .hero-media{background:var(--g)}
.hero.live .hero-media::after{background:linear-gradient(180deg,rgba(255,59,48,0) 40%,var(--card) 100%)}
.hero.noimg-h{padding-top:18px}
.week{display:flex;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:var(--soft);font-weight:600}
.wd.today{color:var(--ink)}
.ring{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:#fff}
.wd.today .ring{box-shadow:inset 0 0 0 2px var(--ink)}
.ring.done{background:var(--g)}
.ring svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stats>div{background:var(--card);border-radius:22px;padding:16px 14px}
.stats b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.stats b i{font-style:normal;font-size:16px;color:var(--soft);font-weight:500}
.stats small{display:block;font-size:14px;color:var(--soft);font-weight:500;margin-top:4px}
.stats.big{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.big b{font-size:32px}
.stats>div.r{background:var(--g)}.stats>div.r small{color:rgba(255,255,255,.8)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;min-height:68px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>.exrow:first-child,.list>.combo:first-child{border-top:0}
.row.big{min-height:80px}
.row:active,.exrow:active{background:var(--card2)}
.row>svg{width:20px;height:20px;color:var(--mute)}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-m b{font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:break-word}
.row-m small{font-size:15px;color:var(--soft)}
.row-m em{font-style:normal;font-size:14px;color:var(--g2);margin-top:2px}
.av{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff;background:var(--g)}
.av svg{width:26px;height:26px;color:#fff}
.av.sm{width:40px;height:40px}.av.xs{width:28px;height:28px;border-radius:8px}.av.xs svg{width:16px;height:16px}
.daytag{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:13px;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grp-l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);padding:16px 4px 4px}
.date{width:50px;text-align:center;flex:none;background:var(--card2);border-radius:14px;padding:7px 0}
.date b{display:block;font-size:20px;font-weight:700;line-height:1}
.date small{font-size:12px;text-transform:uppercase;color:var(--soft)}
.exrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 16px;border-top:1px solid var(--line)}
.exrow .thumb{width:68px;height:68px;border-radius:16px}
.exrow .num{width:26px;flex:none;text-align:center;font-weight:700;color:var(--mute);font-size:15px}
.combo{border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--g)}
.combo .exrow{border-top:0}
.combo-l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g2);padding:14px 16px 0}
.ab{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--g);color:#fff;font-size:12px;font-weight:700;margin-bottom:2px}
/* mídia dos exercícios: cinza + p&b para unificar modelos diferentes */
.thumb{position:relative;display:block;width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--card2);flex:none}
.thumb.sm{width:56px;height:56px}
.anim{position:absolute;inset:0}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s;filter:grayscale(1) contrast(1.05)}
.anim img.f1{opacity:0}
body.alt .anim img.f1{opacity:1}
body.alt .anim img.f0{opacity:0}
.anim video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;color:#6B6B72;text-align:center;padding:4px}
.play{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:56px;padding:0 22px;font-weight:700;font-size:17px;width:100%;background:var(--card2);color:var(--ink)}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--g);color:#fff}
.btn.soft{background:var(--card2)}
.btn.ghost{background:var(--mint);color:var(--g2)}
.btn.danger{background:var(--g);color:#fff}
.btn.ghostdanger{background:transparent;color:var(--g2)}
.btn.xl{min-height:64px;font-size:19px}
.btn.out{background:transparent;box-shadow:inset 0 0 0 1.5px var(--card3)}
.btn.lime{background:var(--ink);color:#000}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.endbtn{display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 16px 0 12px;border-radius:999px;background:var(--mint);color:var(--g2);font-weight:700;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--g)}
.endbtn svg{width:18px;height:18px}
.txtbtn{font-weight:700;color:var(--g2);padding:10px 8px}
.sticky-cta{position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));padding:14px 16px;max-width:560px;margin:0 auto;background:linear-gradient(rgba(12,12,13,0),var(--bg) 35%);z-index:15}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));max-width:536px;margin:0 auto;background:rgba(30,30,33,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;display:flex;padding:6px;z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--soft);padding:6px 0;min-height:56px;justify-content:center;border-radius:999px}
.nav button.on{color:#fff;background:var(--g)}
.nav svg{width:24px;height:24px}
/* treino ao vivo */
.lv{padding-bottom:140px}
.lv-top{display:flex;align-items:center;justify-content:space-between;padding:4px 14px}
.lv-c{text-align:center}
.lv-c b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lv-c small{font-size:14px;color:var(--soft)}
.segs{display:flex;gap:4px;padding:8px 16px 4px}
.segs button{flex:1;height:22px;min-width:0;background:none;position:relative}
.segs button::after{content:'';position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--card3)}
.segs button.ok::after{background:var(--soft)}
.segs button.cur::after{background:var(--g)}
.lv-page{padding:4px 16px 0}
.lv-count{font-size:14px;color:var(--soft);font-weight:600;margin:6px 4px 12px;text-transform:uppercase;letter-spacing:.08em}
.lv-media{position:relative;display:block;width:100%;aspect-ratio:16/11;border-radius:28px;overflow:hidden;background:#000}
.lv-media .anim img{object-fit:contain}
.fsb{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:rgba(12,12,13,.8);color:#fff;display:grid;place-items:center}
.fsb svg{width:18px;height:18px}
.lv-name{font-weight:700;font-size:32px;line-height:1.05;letter-spacing:-.03em;margin:18px 4px 8px}
.lv-mini{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.lv-mini .thumb{width:84px;height:84px;border-radius:18px}
.lv-mini h2{font-weight:700;font-size:23px;line-height:1.08;letter-spacing:-.02em;margin:4px 0 0}
.lv-meta{display:flex;flex-wrap:wrap;gap:8px;margin:6px 4px 10px}
.lv-meta span{font-size:15px;font-weight:600;background:var(--card2);border-radius:999px;padding:7px 12px}
.lv-note{margin:4px 4px 12px;font-size:16px;color:var(--g2);font-weight:500}
.lv-last{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:18px;padding:14px 16px;margin:0 0 12px;font-size:15px;color:var(--soft)}
.lv-last svg{width:18px;height:18px;margin-top:1px}
.lv-last b{color:var(--ink);font-weight:600}
.lv-ex{margin-bottom:6px}
.combo-sep{text-align:center;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);margin:16px 0}
.sets{display:flex;flex-direction:column;gap:8px}
.shead{display:grid;grid-template-columns:24px 1fr 1fr 60px;gap:8px;padding:0 10px 0 14px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.srow{display:grid;grid-template-columns:24px 1fr 1fr 60px;gap:8px;align-items:center;background:var(--card);border-radius:22px;padding:8px 8px 8px 14px;width:100%;text-align:left}
.srow.cur{box-shadow:inset 0 0 0 2px var(--g)}
.srow.done{grid-template-columns:24px 1fr 60px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--card2);min-height:64px}
.sn{font-weight:700;color:var(--soft);font-size:18px;text-align:center}
.sdone{font-weight:600;font-size:18px;color:var(--soft);font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;background:var(--card2);border-radius:16px;height:60px;min-width:0}
.stp button{width:38px;height:60px;font-size:26px;font-weight:400;color:var(--ink);flex:none}
.stp button:active{background:var(--card3);border-radius:14px}
.stp label{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.stp input::placeholder{color:var(--mute)}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;padding:0;outline:0;color:var(--ink)}
.stp small{font-size:12px;color:var(--soft);font-weight:600;margin-top:3px}
.chk{width:60px;height:60px;border-radius:50%;background:var(--card2);color:var(--mute);display:grid;place-items:center}
.chk svg{width:28px;height:28px}
.srow.cur .chk{background:var(--g);color:#fff}
.chk.on{background:var(--card2);color:var(--g)}
.lv-foot{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:stretch;padding:12px 16px calc(14px + var(--safe-b));background:linear-gradient(rgba(12,12,13,0),var(--bg) 22%);z-index:15}
.lv-foot .prev{flex:none;min-width:64px;padding:0 18px;border-radius:999px;background:var(--card2);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-weight:700}
.lv-foot .prev svg{width:24px;height:24px}
.lv-foot .prev:disabled{opacity:.25}
.lv-foot .nx{flex:1;width:auto;min-width:0;justify-content:space-between;text-align:left;min-height:70px;border-radius:999px;background:var(--ink);color:#000;padding:0 8px 0 24px}
.lv-foot .nx.go{background:var(--g);color:#fff;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.lv-foot .nx .arr{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.12);display:grid;place-items:center;flex:none}
.lv-foot .nx.go .arr{background:rgba(255,255,255,.2)}
.lv-foot .nx .arr svg{width:24px;height:24px}
.lv-foot .nx span{display:flex;flex-direction:column;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:17px}
.lv-foot .nx small{font-size:12px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:.08em}
.ed-ex{background:var(--card2);border-radius:20px;padding:6px 14px 12px;margin-bottom:10px}
.ed-n{display:block;padding:10px 0 2px;font-size:16px}
.ed-set{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--card3)}
.ed-v{flex:1;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.ed-v i,.ed-name i{font-style:normal;font-size:13px;color:var(--soft);font-weight:500;margin-left:6px}
.ed-del,.ed-mv{width:44px;height:44px;border-radius:14px;background:var(--card3);display:grid;place-items:center;flex:none}
.ed-del svg,.ed-mv svg{width:20px;height:20px}
.ed-add{display:flex;align-items:center;gap:8px;color:var(--g2);font-weight:700;padding:14px 0 4px}
.ed-add svg{width:18px;height:18px}
.ed-list{background:var(--card2);border-radius:20px;overflow:hidden}
.ed-row{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-top:1px solid var(--card3)}
.ed-row:first-child{border-top:0}
.ed-row.cur{box-shadow:inset 4px 0 0 var(--g)}
.ed-i{width:22px;font-weight:700;color:var(--soft);text-align:center;flex:none}
.ed-name{flex:1;min-width:0;text-align:left;font-weight:600;font-size:15px;line-height:1.25;padding:6px 0}
.rest{position:fixed;inset:0;z-index:60;background:var(--bg);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(20px + var(--safe-t)) 24px calc(24px + var(--safe-b));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.rest>small{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.ringwrap{position:relative;width:min(74vw,300px);aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--card2);stroke-width:14}
.rp{fill:none;stroke:var(--g);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(60px,19vw,84px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.rnext{margin:0;text-align:center;color:var(--ink);font-size:18px;font-weight:500;max-width:320px}
.radj{display:flex;gap:12px}
.radj button{width:100px;height:56px;border-radius:999px;background:var(--card2);font-weight:700;font-size:17px}
.rskip{background:var(--ink);color:#000;max-width:340px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:15px;font-weight:600;color:var(--soft)}
.field input,.field textarea,.field select,.sel{border:0;border-radius:16px;padding:15px 16px;background:var(--card2);width:100%;font-size:17px;color:var(--ink)}
.field input:focus,.field textarea:focus{outline:0;box-shadow:inset 0 0 0 2px var(--g)}
.sel{margin-bottom:14px;font-weight:600;appearance:auto}
.grid2>*,.grid3>*{min-width:0}
.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:54px;min-width:0;max-width:100%;display:block}
.field{min-width:0}
.card input[style]{background:var(--card2)!important;border:0!important;color:var(--ink)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

let sb = null, user = null, saveTimer = null;
const pend = { get(){ return ls.get('serie.pending') || {plans:false, sessions:[], deletes:[]}; }, set(v){ ls.set('serie.pending', v); } };
async function flushPending(){
  if(!sb || !user || !navigator.onLine) return;
  const p = pend.get(); let changed = false;
  if(p.plans){ const { error } = await sb.from('user_plans').upsert({ user_id:user.id, plans:S.plans, updated_at:new Date().toISOString() }); if(!error){ p.plans=false; changed=true; } }
  for(const h of [...p.sessions]){ const { error } = await sb.from('sessions').upsert({ id:h.id, user_id:user.id, date:h.date, data:h }); if(!error){ p.sessions=p.sessions.filter(x=>x.id!==h.id); changed=true; } }
  for(const id of [...p.deletes]){ const { error } = await sb.from('sessions').delete().eq('id', id); if(!error){ p.deletes=p.deletes.filter(x=>x!==id); changed=true; } }
  if(changed){ pend.set(p); S.syncNote = (p.plans||p.sessions.length||p.deletes.length) ? 'Alterações pendentes — vão sincronizar quando voltar a internet' : ''; }
}
function noCombo(plans){
  (plans||[]).forEach(p => (p.days||[]).forEach(d => {
    const out=[]; (d.blocks||[]).forEach(b => b.items.forEach((it,k) => { if(!+it.rest) it.rest = /cardio|esteira|bike|el[ií]ptico/i.test(it.name) ? '0' : '60'; out.push(k===0 ? {id:b.id, items:[it]} : {id:uid(), items:[it]}); }));
    d.blocks = out;
  }));
  return plans;
}
function savePlans(){
  noCombo(S.plans);
  ls.set('serie.plans', S.plans);
  const p = pend.get(); p.plans = true; pend.set(p);
  clearTimeout(saveTimer); saveTimer = setTimeout(flushPending, 500);
}
async function saveSession(h){
  S.history.unshift(h); S.history.sort((a,b)=> b.date.localeCompare(a.date)); ls.set('serie.history', S.history);
  const p = pend.get(); p.sessions.push(h); pend.set(p); await flushPending();
}
async function deleteSession(id){
  S.history = S.history.filter(h=>h.id!==id); ls.set('serie.history', S.history);
  const p = pend.get(); p.sessions = p.sessions.filter(x=>x.id!==id); p.deletes.push(id); pend.set(p); await flushPending();
}
async function saveProfile(pr){
  S.profile = pr; ls.set('serie.profile', pr);
  const { error } = await sb.from('profiles').upsert({ id:user.id, ...pr, updated_at:new Date().toISOString() });
  if(error){ toast('Erro ao salvar perfil: '+error.message); throw error; }
}
async function loadAll(){
  try{
    const [pr, pl, hs] = await Promise.all([
      sb.from('profiles').select('*').eq('id', user.id).maybeSingle(),
      sb.from('user_plans').select('plans').eq('user_id', user.id).maybeSingle(),
      sb.from('sessions').select('data').eq('user_id', user.id).order('date', {ascending:false}).limit(1000)
    ]);
    if(pr.error || pl.error || hs.error) throw (pr.error || pl.error || hs.error);
    const p = pend.get();
    S.profile = pr.data || null;
    if(!p.plans) S.plans = noCombo((pl.data && pl.data.plans) || []);
    const remote = hs.data.map(r => r.data);
    S.history = [...p.sessions.filter(x=>!remote.some(r=>r.id===x.id)), ...remote].filter(h=>!p.deletes.includes(h.id)).sort((a,b)=>b.date.localeCompare(a.date));
    ls.set('serie.profile', S.profile); ls.set('serie.plans', S.plans); ls.set('serie.history', S.history);
    S.syncNote = '';
    flushPending();
  }catch(e){
    console.warn(e);
    S.profile = ls.get('serie.profile'); S.plans = noCombo(ls.get('serie.plans') || []); S.history = ls.get('serie.history') || [];
    S.syncNote = 'Sem internet — usando os dados salvos neste celular';
  }
  await splashWait();
  S.loaded = true;
  if(!S.profile) S.stack = [{v:'onboard'}];
  else if(['login','onboard','boot'].includes(cur().v)) S.stack = [{v:'home'}];
  render();
}
async function initData(){
  S.stack = [{v:'boot'}]; render();
  if(!window.supabase){ // sem internet na primeira abertura
    S.profile = ls.get('serie.profile'); S.plans = noCombo(ls.get('serie.plans')||[]); S.history = ls.get('serie.history')||[];
    if(S.profile){ S.loaded=true; S.syncNote='Sem internet — usando os dados salvos neste celular'; S.stack=[{v:'home'}]; } else S.stack=[{v:'login'}];
    render(); return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  sb.auth.onAuthStateChange((ev, session) => {
    if(ev === 'PASSWORD_RECOVERY'){ user = session && session.user; S.stack = [{v:'newpass'}]; render(); }
  });
  const { data } = await sb.auth.getSession();
  if(!data.session){
    if(ls.get('serie.profile') && !navigator.onLine){ S.profile = ls.get('serie.profile'); S.plans = noCombo(ls.get('serie.plans')||[]); S.history = ls.get('serie.history')||[]; S.loaded=true; S.stack=[{v:'home'}]; render(); return; }
    await splashWait(); S.stack = [{v:'login'}]; render(); return;
  }
  user = data.session.user;
  if(cur().v !== 'newpass') await loadAll();
}
window.addEventListener('online', () => { flushPending().then(()=>render()); });

function weekDays(){
  const now = new Date(); const dow = (now.getDay()+6)%7; const mon = new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-dow);
  const done = new Set(S.history.map(h => { const d=new Date(h.date); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }));
  return ['S','T','Q','Q','S','S','D'].map((l,i) => { const d = new Date(mon); d.setDate(mon.getDate()+i); return { l, done: done.has(d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()), today: i===dow }; });
}
function monthCount(){ const n=new Date(); return S.history.filter(h=>{const d=new Date(h.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).length; }

function monthProgress(ref){
  const n = ref || new Date(); const inM = h => { const d=new Date(h.date); return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear(); };
  const hs = S.history.filter(inM).slice().reverse();
  const map = {};
  hs.forEach(h => h.exercises.forEach(e => { const v = e.sets.filter(z=>z.done).map(z=>num(z.load)).filter(v=>v!=null&&v>0); if(!v.length) return; const mx=Math.max(...v); const k=e.name; (map[k] = map[k] || {name:k, pts:[]}).pts.push({date:h.date, v:mx}); }));
  const list = Object.values(map).map(x => ({ name:x.name, n:x.pts.length, a:x.pts[0].v, b:x.pts[x.pts.length-1].v, best:Math.max(...x.pts.map(p=>p.v)), d:x.pts[x.pts.length-1].v - x.pts[0].v, pts:x.pts })).sort((p,q)=> q.d-p.d || q.n-p.n);

}

function startRest(secs, label){ if(!secs) return; rest = { end: Date.now()+secs*1000, total: secs, label }; }

    else { const t=$('#restT'), rp=$('#rp'); if(t){ t.textContent = fmtDur(left); const C=2*Math.PI*120; rp.setAttribute('stroke-dashoffset', C*(1-left/rest.total)); } }

function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); [0,.22].forEach(t=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.value=.18; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.15); }); }catch(e){} }
function tick(bi, ii, si){
  const s = S.session, b = s.blocks[bi], it = b.items[ii], z = it.sets[si];
  z.done = !z.done; ls.set('serie.session', s);

function sessionStats(s, endAt){

  const dur = Math.max(0,(endAt-s.startedAt)/1000);
  let bw = num(S.profile && S.profile.weight) || 75;

  return { items, exTotal: items.length, exDone, sets: done.length, setsTotal: items.reduce((a,it)=>a+it.sets.length,0), reps, dur, kcal, bw, vol: Math.round(volume(s)) };

  '<b class="sec-t">Histórico <small>'+S.history.length+' treinos</small></b>'+
  (!S.history.length ? '<div class="card empty">'+I.hist+'<p>Nenhum treino salvo ainda.</p></div>' :
  '<div class="list">'+S.history.slice(0, st.lim||30).map(h => { const dt = new Date(h.date); const sets = h.exercises.reduce((a,e)=>a+e.sets.filter(z=>z.done).length,0);
    return '<button class="row" data-act="go" data-v="session" data-id="'+h.id+'"><span class="date" style="box-shadow:inset 0 -3px 0 '+catColor((h.daySub||'')+' '+h.dayTitle)+'"><b>'+pad(dt.getDate())+'</b><small>'+dt.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</small></span><div class="row-m"><b>'+esc(h.daySub||h.dayTitle)+'</b><small>'+fmtDur(h.durationSec)+' · '+sets+' séries · '+fmtTon(h.volume||0)+'</small></div>'+I.chev+'</button>'; }).join('')+'</div>'+
  (S.history.length > (st.lim||30) ? '<button class="btn soft" data-act="histMore" style="margin-top:12px">Ver mais</button>' : ''))+
  '</div>' + nav('progress');
};
function chartSVG(pts){
  const W=320,H=180,P=26; const vs=pts.map(p=>p.v); let mn=Math.min(...vs), mx=Math.max(...vs); if(mn===mx){mn-=5;mx+=5;}
  const x=i=> pts.length===1 ? W/2 : P+(W-2*P)*i/(pts.length-1), y=v=> H-P-(H-2*P)*(v-mn)/(mx-mn);
  const line = pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area = line + ' L'+x(pts.length-1).toFixed(1)+' '+(H-P)+' L'+x(0).toFixed(1)+' '+(H-P)+' Z';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF3B30" stop-opacity=".35"/><stop offset="1" stop-color="#FF3B30" stop-opacity="0"/></linearGradient></defs><line x1="'+P+'" x2="'+(W-P)+'" y1="'+(H-P)+'" y2="'+(H-P)+'" stroke="#2E2E32"/>'+
    (pts.length>1?'<path d="'+area+'" fill="url(#ga)"/>':'')+'<path d="'+line+'" fill="none" stroke="#FF3B30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="4.5" fill="#18181A" stroke="#FF3B30" stroke-width="2.5"/>'+(i===pts.length-1||i===0?'<text x="'+x(i)+'" y="'+(y(p.v)-11)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#F5F5F7">'+p.v+'</text>':'')+'<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="#9C9CA3">'+fmtDate(p.date).slice(0,5)+'</text>').join('')+'</svg>';
}

function programToPlan(g){
  const plan = { id: uid(), name: g.name, goal: g.goal, level: g.level, start: new Date().toISOString().slice(0,10), end:'', fromGuide: g.id, guide: g.tips, days: [] };
  g.days.forEach(([t, f, list]) => {
    const blocks = [];
    list.forEach(([name, exId, sets, reps, rest, combine]) => {
      const it = { id: uid(), exId, name, sets: String(sets), reps: String(reps), load:'', rest: String(rest), notes:'' };
      if(!+it.rest && !/cardio/i.test(name)) it.rest='60'; blocks.push({ id: uid(), items:[it] });

    plan.days.push({ id: uid(), title: t, subtitle: f, blocks });
  });
  return plan;

  if(!cat && !q){

    (picking ? '' : nav('library'));
  }

  let list = (LIB||[]).filter(e => (!cat || cat.m.includes(e.muscle)) && (!q || e.name.toLowerCase().includes(q) || (MUSC[e.muscle]||'').includes(q) || (EQUIP[e.equip]||e.equip).includes(q)));

};

function genPlan({goal='Hipertrofia', freq=4, level='Iniciante', style='split'}){

  const nDays = full ? Math.min(freq, 4) : freq;

  const days = [];
  for(let d=0; d<nDays; d++){
    const layout = full ? FULL : SPLITS[freq][d];
    const variation = full ? d : (freq===6 && d>=3 ? 1 : 0);
    const items = [];
    layout.forEach(([g,n]) => pickEx(g, level, n, variation).forEach(e => {
      const [sets, reps, rest] = cfg[e[2]==='c'?'c':'i'][lv];
      items.push({ id: uid(), exId: e[1], name: e[0], sets: String(e[1]==='Plank'?3:sets), reps: e[1]==='Plank' ? '30-45s' : String(reps), load:'', rest:String(rest), notes:'' });
    }));

    let blocks;
    if(cfg.pairs){ blocks=[]; for(let k=0;k<items.length;k+=2) blocks.push({ id:uid(), items: items.slice(k,k+2) }); }
    else blocks = items.map(it => ({ id:uid(), items:[it] }));

    days.push({ id: uid(), title: titles[d] || ('Treino '+'ABCDEF'[d]), subtitle: (full ? 'Full body '+'ABCD'[d]+' · ' : '') + groups, blocks });

}
function dayMinutes(d){ const secs = d.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>{ const n = it.scheme? it.scheme.length : (+it.sets||3); const r = /min/.test(it.reps) ? (num(it.reps)||20)*60 : n*(40+(+it.rest||60)); return x + (/min/.test(it.reps) ? r : r); },0),0); return Math.round(secs/60 + 6); }

function matchExercise(name, en){
  if(!LIB) return null;
  const ids = new Set(LIB.map(e=>e.id));
  const n = norm(name);
  for(const g of Object.values(EXDB)) for(const e of g) if(norm(e[0])===n) return e[1];
  if(en){ const ne = norm(en); const exact = LIB.find(e=>norm(e.name)===ne); if(exact) return exact.id;
    const tk = new Set(ne.split(' ').filter(w=>w.length>2)); let best=null, bs=0;
    for(const e of LIB){ const et = norm(e.name).split(' ').filter(w=>w.length>2); if(!et.length) continue; const inter = et.filter(w=>tk.has(w)).length; const sc = inter/Math.max(tk.size, et.length); if(sc>bs){ bs=sc; best=e.id; } }
    if(bs>=0.5) return best; }
  for(const [k,v] of PT_ALIAS) if(n.includes(k) && ids.has(v)) return v;
  return null;
}

function parseAI(txt){

  return { name:n, age: num($('#p-age').value), weight: num($('#p-weight').value), height: num($('#p-height').value), goal: st.goal || pr.goal || 'Hipertrofia', weekly_target: +(st.wk || pr.weekly_target || 4) };
}

async function authSubmit(){
  const st = cur(); const email = $('#a-email').value.trim(); const passEl = $('#a-pass'); const pass = passEl ? passEl.value : '';
  st.email = email; st.err = st.msg = ''; st.busy = true; keepForm(()=>render());
  try{
    if(st.mode === 'forgot'){
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if(error) throw error; st.msg = 'Se esse e-mail tiver conta, o link chega em instantes.';
    } else {
      if(pass.length < 6) throw new Error('A senha precisa ter pelo menos 6 caracteres.');
      const r = st.mode === 'up' ? await sb.auth.signUp({ email, password: pass, options:{ emailRedirectTo: location.origin + location.pathname } }) : await sb.auth.signInWithPassword({ email, password: pass });
      if(r.error) throw r.error;
      if(st.mode === 'up' && r.data.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0){ st.err = 'Esse e-mail já tem conta. Toque em Entrar.'; st.mode='in'; }
      else if(!r.data.session){ st.msg = 'Conta criada, mas precisa confirmar: abra o e-mail do Supabase (veja o spam), toque no link e depois volte aqui e toque em Entrar.'; st.mode='in'; }
      else { user = r.data.session.user; st.busy=false; S.loaded=false; await loadAll(); return; }
    }
  }catch(e){
    const m = String(e.message||e);
    st.err = /Invalid login/i.test(m) ? 'E-mail ou senha incorretos.' : /already registered/i.test(m) ? 'Esse e-mail já tem conta. Use Entrar.' : /Email not confirmed/i.test(m) ? 'Confirme seu e-mail pelo link que enviamos.' : /Failed to fetch|network/i.test(m) ? 'Sem internet.' : /valid password|Password should/i.test(m) ? 'A senha precisa ter pelo menos 6 caracteres.' : /rate limit|too many/i.test(m) ? 'Muitas tentativas. Espere um minuto e tente de novo.' : m;
  }
  st.busy = false; keepForm(()=>render());
}

// ---------- render ----------
function render(){
  const st = cur(); const fn = V[st.v] || V.home;
  const y = window.scrollY;
  $('#app').innerHTML = fn(st);
  hydrateImages($('#app'));
  if(st.v==='library'){ const q=$('#libq'); if(q && st.focus){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  if(st.keepScroll){ window.scrollTo(0,y); st.keepScroll=false; }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(stop && el.dataset.act==='closeLayer' && !stop.contains(el)===false && el.classList.contains('modal')) return;
  if(el.classList.contains('modal') && e.target !== el) return;
  const a = el.dataset.act, D = el.dataset;
  const st = cur();
  switch(a){
    case 'back': if(['editDay','editPlan'].includes(st.v)) S.editDraft=null; backTo(); break;
    case 'home': home(); break;
    case 'go': { const p={}; if(D.plan) p.plan=D.plan; if(D.day) p.day=D.day; if(D.id) p.id=D.id; if(D.v===cur().v && !D.plan && !D.id && !cur().cat && !cur().q){ return; } $('#layer').innerHTML=''; if(['plans','progress','guide'].includes(D.v)) S.stack=[{v:'home'}]; go(D.v,p); break; }
    case 'resume': S.stack=[{v:'home'},{v:'live'}]; render(); keepAwake(); break;
    case 'start': startSession(D.plan, D.day); break;
    case 'viewEx': if(!D.ex){ toast('Este exercício ainda não tem vídeo'); break; } loadLib().then(()=>viewer(D.ex, D.name, D.notes)); break;
    case 'closeLayer': $('#layer').innerHTML=''; confirmCb=null; break;
    case 'confirmOk': { const cb=confirmCb; $('#layer').innerHTML=''; confirmCb=null; cb&&cb(); break; }
    case 'tick': tick(+D.b, +D.i, +D.s); break;
    case 'adj': { const it=S.session.blocks[+D.b].items[+D.i], z=it.sets[+D.s]; const f=D.f, d=+D.d; let v=num(z[f])||0;
      if(f==='load'){ v=Math.max(0, Math.round((v+d)*10)/10); z.load=String(v); if(!it.scheme) it.sets.forEach((x,k)=>{ if(k>+D.s && !x.done) x.load=String(v); }); }
      else { v=Math.max(0,v+d); z.reps=String(v); }
      ls.set('serie.session', S.session); st.keepScroll=true; render(); break; }
    case 'lvEdit': lvEditSheet(); break;
    case 'lvSetDel': { const it=S.session.blocks[S.session.idx||0].items[+D.i]; if(it.sets.length>1){ it.sets.splice(+D.s,1); lvSave(); } break; }
    case 'lvSetAdd': { const it=S.session.blocks[S.session.idx||0].items[+D.i]; const l=it.sets[it.sets.length-1]||{reps:'',load:''}; it.sets.push({reps:l.reps, load:l.load, done:false}); lvSave(); break; }
    case 'lvMove': { const s=S.session, i=+D.i, j=i+(+D.d); if(j<0||j>=s.blocks.length) break; const bs=s.blocks; [bs[i],bs[j]]=[bs[j],bs[i]]; if(s.idx===i) s.idx=j; else if(s.idx===j) s.idx=i; lvSave(); break; }
    case 'lvExDel': { const s=S.session, i=+D.i; if(s.blocks.length<2) break; s.blocks.splice(i,1); if((s.idx||0)>=s.blocks.length) s.idx=s.blocks.length-1; else if(i<(s.idx||0)) s.idx--; lvSave(); break; }
    case 'lvJump': S.session.idx=+D.i; ls.set('serie.session', S.session); $('#layer').innerHTML=''; render(); window.scrollTo(0,0); break;
    case 'lvSavePlan': lvSavePlan(); break;
    case 'liveGo': { const i=+D.i; if(S.session && i>=0 && i<S.session.blocks.length){ S.session.idx=i; ls.set('serie.session', S.session); render(); window.scrollTo(0,0); } break; }
    case 'pickDay': pickDaySheet(); break;
    case 'histMore': st.lim=(st.lim||30)+30; st.keepScroll=true; render(); break;
    case 'restAdd': if(rest){ const d=+(D.d||15); rest.end=Math.max(Date.now()+1000, rest.end+d*1000); if(d>0) rest.total+=d; } break;
    case 'restSkip': rest=null; { const t=$('#rest'); t&&t.remove(); } break;
    case 'finish': finishFlow(); break;
    case 'finishOk': finishOk(); break;
    case 'discard': { const empty = S.session && !S.session.blocks.some(b=>b.items.some(it=>it.sets.some(z=>z.done))); const go_=()=>{ S.session=null; rest=null; ls.del('serie.session'); try{ wakeLock && wakeLock.release(); }catch(e){} home(); }; empty ? go_() : confirmBox('Descartar este treino? As séries marcadas não vão pro histórico.', go_, 'Descartar', true); break; }
    case 'delSession': confirmBox('Apagar este registro do histórico?', async ()=>{ await deleteSession(D.id); backTo(); }, 'Apagar', true); break;
    case 'selProg': st.sel = D.n; st.keepScroll=true; render(); setTimeout(()=>{ const e=$('#evo'); e&&e.scrollIntoView({behavior:'smooth',block:'center'}); },30); break;
    case 'gFilter': st.f = D.f; st.keepScroll=true; render(); break;
    case 'moShift': st.mo = Math.min(0,(st.mo||0)+(+D.d)); st.keepScroll=true; render(); break;
    case 'progAll': st.all = true; st.keepScroll=true; render(); break;
    case 'useProg': { const g = PROGRAMS.find(x=>x.id===D.id); if(!g) break; const pl = programToPlan(g); S.plans.unshift(pl); savePlans(); S.stack=[{v:'home'},{v:'plans'},{v:'plan',plan:pl.id}]; render(); window.scrollTo(0,0); toast('Programa adicionado'); break; }
    case 'libCat': go('library', {cat:D.c, pick:st.pick, b:st.b, i:st.i}); break;
    case 'libEq': st.eq = D.e; st.lim=40; render(); break;
    case 'full': fullView(D.ex, D.name); break;
    case 'closeFull': closeFull(); break;
    case 'fullPlay': fullPlay(!fullT); break;
    case 'fullToggle': fullPlay(false); setFrame(+($('#full').dataset.f)?0:1); break;
    case 'fullFrame': fullPlay(false); setFrame(+D.f); break;
    case 'libMore': st.lim=(st.lim||40)+40; st.keepScroll=true; render(); break;
    // plan editing
    case 'newPlan': S.editDraft={id:uid(),name:'Novo plano',goal:'Hipertrofia',level:'',start:'',end:'',days:[{id:uid(),title:'Treino A',subtitle:'',blocks:[]}]}; go('editPlan',{isNew:true}); break;
    case 'editPlan': S.editDraft=clone(findPlan(D.plan)); go('editPlan',{plan:D.plan}); break;
    case 'authMode': st.mode = D.m; st.err = st.msg = ''; render(); break;
    case 'pGoal': st.goal = D.g; keepForm(()=>{ st.keepScroll=true; render(); }); break;
    case 'pWk': st.wk = +D.n; keepForm(()=>{ st.keepScroll=true; render(); }); break;
    case 'gLvl': st.lvl = D.l; keepForm(()=>{ st.keepScroll=true; render(); }); break;
    case 'gStyle': st.style = D.s; keepForm(()=>{ st.keepScroll=true; render(); }); break;
    case 'genOk': { const pl = genPreview(st).plan; S.plans.push(pl); savePlans(); S.stack=[{v:'home'},{v:'plans'},{v:'plan',plan:pl.id}]; render(); window.scrollTo(0,0); toast('Plano adicionado'); break; }
    case 'copyPrompt': copyText(AI_PROMPT, 'Instruções copiadas — cole na sua IA'); break;
    case 'exportPlan': { const p=findPlan(D.plan); loadLib().then(()=>copyText(exportText(p), 'Treino copiado — cole na sua IA e peça o ajuste')); break; }
    case 'impParse': { st.txt = $('#impTxt').value; st.err=''; st.parsed=null; loadLib().then(()=>{ try{ st.parsed = parseAI(st.txt); }catch(e){ st.err = e.message; } render(); setTimeout(()=>{ const c=document.querySelector('.pvday'); c && c.scrollIntoView({behavior:'smooth', block:'center'}); }, 50); }); break; }
    case 'impOk': { const r = st.parsed; if(!r) break; let pl = r.plan;
      if(D.mode==='replace'){ const i=S.plans.findIndex(x=>x.id===r.replaces); const old=S.plans[i]; pl = { ...pl, id: old.id, color: old.color, icon: old.icon, start: old.start, end: old.end, guide: old.guide }; S.plans[i]=pl; }
      else { pl.id = findPlan(pl.id) ? uid() : pl.id; S.plans.push(pl); }
      savePlans(); S.stack=[{v:'home'},{v:'plans'},{v:'plan',plan:pl.id}]; render(); window.scrollTo(0,0); toast(D.mode==='replace'?'Plano atualizado':'Plano importado'); break; }
    case 'pTpl': st.tpl = D.t; keepForm(()=>{ st.keepScroll=true; render(); }); break;
    case 'onboardOk': { const pr = readProfile(st); if(!pr) break; st.busy=true; render(); (async()=>{ try{ await saveProfile(pr); const tp = st.tpl ?? 'rec'; if(tp==='rec'){ S.plans.push(genPreview(st).plan); savePlans(); } else { const t = TEMPLATES.find(x=>x.id===tp); if(t && !S.plans.some(x=>x.id===t.id)){ S.plans.push(clone(t)); savePlans(); } } S.stack = tp==='import' ? [{v:'home'},{v:'plans'},{v:'import'}] : [{v:'home'}]; render(); toast('Bem-vindo, '+pr.name.split(' ')[0]+'!'); }catch(e){ st.busy=false; render(); } })(); break; }
    case 'profileOk': { const pr = readProfile(st); if(!pr) break; saveProfile(pr).then(()=>{ toast('Perfil salvo'); render(); }).catch(()=>{}); break; }
    case 'logout': confirmBox('Sair da conta neste celular?', logout, 'Sair', true); break;
    case 'copyLink': { const u = location.origin+location.pathname; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(()=>toast('Link copiado')).catch(()=>toast(u)); break; }
    case 'pColor': S.editDraft.color=D.c; st.keepScroll=true; render(); break;
    case 'pIcon': S.editDraft.icon=D.k; st.keepScroll=true; render(); break;
    case 'dayAdd': S.editDraft.days.push({id:uid(),title:'Treino '+'ABCDEFGH'[S.editDraft.days.length]||'',subtitle:'',blocks:[]}); st.keepScroll=true; render(); break;
    case 'dayUp': { const i=+D.i; if(i>0){ const ds=S.editDraft.days; [ds[i-1],ds[i]]=[ds[i],ds[i-1]]; } st.keepScroll=true; render(); break; }
    case 'dayDel': { const i=+D.i; const d=S.editDraft.days[i]; const go_=()=>{ S.editDraft.days.splice(i,1); st.keepScroll=true; render(); }; d.blocks.length ? confirmBox('Remover "'+d.title+'" e seus exercícios?', go_, 'Remover', true) : go_(); break; }
    case 'savePlan': { const p=S.editDraft; const i=S.plans.findIndex(x=>x.id===p.id); if(i>=0) S.plans[i]=p; else S.plans.push(p); S.editDraft=null; savePlans(); S.stack.pop(); if(st.isNew){ S.stack.push({v:'plan',plan:p.id}); } render(); toast('Plano salvo'); break; }
    case 'delPlan': confirmBox('Apagar o plano "'+S.editDraft.name+'"? O histórico continua.', ()=>{ S.plans=S.plans.filter(x=>x.id!==S.editDraft.id); S.editDraft=null; savePlans(); S.stack=[{v:'home'},{v:'plans'}]; render(); }, 'Apagar', true); break;
    // day editing
    case 'editDay': S.editDraft=clone(findDay(findPlan(D.plan), D.day)); go('editDay',{plan:D.plan,day:D.day}); break;
    case 'editItem': if(e.target.closest('.mini')) break; itemSheet(+D.b, +D.i); break;
    case 'itemOk': { const it=S.editDraft.blocks[+D.b].items[+D.i]; it.name=$('#f-name').value.trim()||it.name; it.sets=$('#f-sets').value.trim()||'3'; it.reps=$('#f-reps').value.trim()||'10'; it.rest=$('#f-rest').value.trim()||'60'; it.load=$('#f-load').value.trim(); it.notes=$('#f-notes').value.trim(); { const sc=$('#f-scheme').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(\S+)\s*[x×X*]\s*(.+)$/); return m?{reps:m[1],load:m[2].trim()}:null; }).filter(Boolean); if(sc.length){ it.scheme=sc; it.sets=String(sc.length); } else delete it.scheme; } $('#layer').innerHTML=''; st.keepScroll=true; render(); break; }
    case 'itemDel': { const b=S.editDraft.blocks[+D.b]; b.items.splice(+D.i,1); if(!b.items.length) S.editDraft.blocks.splice(+D.b,1); $('#layer').innerHTML=''; st.keepScroll=true; render(); break; }
    case 'itemUp': case 'itemDown': { moveItem(+D.b,+D.i,a==='itemUp'?-1:1); st.keepScroll=true; render(); break; }

    case 'unlink': { const bs=S.editDraft.blocks; const bi=+D.b, ii=+D.i; const rest_=bs[bi].items.splice(ii); bs.splice(bi+1,0,{id:uid(),items:rest_}); st.keepScroll=true; render(); break; }
    case 'addItem': go('library',{pick:'add'}); break;
    case 'changeEx': $('#layer').innerHTML=''; go('library',{pick:'change',b:+D.b,i:+D.i}); break;
    case 'pickEx': case 'pickCustom': {
      const lib = LIBMAP[D.ex];
      while(S.stack.length>1 && cur().v==='library') S.stack.pop(); if(st.pick==='add'){ const it={id:uid(),exId:lib?lib.id:null,name:lib?lib.name:'Novo exercício',sets:'3',reps:'10',load:'',rest:'60',notes:''}; S.editDraft.blocks.push({id:uid(),items:[it]}); render(); itemSheet(S.editDraft.blocks.length-1,0); }
      else { const it=S.editDraft.blocks[st.b].items[st.i]; if(lib){ it.exId=lib.id; if(!it.name||it.name==='Novo exercício') it.name=lib.name; } else it.exId=null; const b=st.b,i=st.i; render(); itemSheet(b,i); }
      break; }
    case 'saveDay': { const p=findPlan(st.plan); const i=p.days.findIndex(x=>x.id===st.day); p.days[i]=S.editDraft; S.editDraft=null; savePlans(); backTo(); toast('Treino salvo'); break; }
  }
});
function moveItem(bi, ii, dir){
  const bs=S.editDraft.blocks, b=bs[bi];
  if(b.items.length>1){ const j=ii+dir; if(j>=0 && j<b.items.length){ [b.items[ii],b.items[j]]=[b.items[j],b.items[ii]]; return; } }
  const nb=bi+dir; if(nb<0||nb>=bs.length) return;
  if(b.items.length===1){ [bs[bi],bs[nb]]=[bs[nb],bs[bi]]; }
  else { const it=b.items.splice(ii,1)[0]; bs.splice(dir>0?bi+1:bi,0,{id:uid(),items:[it]}); }
}
document.addEventListener('input', e => {
  const t=e.target; const st=cur();
  if(t.id==='impTxt'){ st.txt=t.value; return; }
  if(t.id==='libq'){ st.q=t.value; st.lim=40; st.focus=true; clearTimeout(t._d); t._d=setTimeout(()=>render(),200); return; }
  if(t.dataset.in && S.session){ S.session.blocks[+t.dataset.b].items[+t.dataset.i].sets[+t.dataset.s][t.dataset.in]=t.value; ls.set('serie.session', S.session);
    // propagate load to following unchecked sets
    if(t.dataset.in==='load' && !S.session.blocks[+t.dataset.b].items[+t.dataset.i].scheme){ const it=S.session.blocks[+t.dataset.b].items[+t.dataset.i]; it.sets.forEach((z,si)=>{ if(si>+t.dataset.s && !z.done){ z.load=t.value; const inp=document.querySelector('input[data-in="load"][data-b="'+t.dataset.b+'"][data-i="'+t.dataset.i+'"][data-s="'+si+'"]'); if(inp) inp.value=t.value; } }); }
    return; }
  if(t.dataset.pf && S.editDraft){ S.editDraft[t.dataset.pf]=t.value; return; }
  if(t.dataset.df && S.editDraft){ S.editDraft.days[+t.dataset.i][t.dataset.df]=t.value; return; }
});

let tsx=null, tsy=null;
document.addEventListener('touchstart', e => { if(e.target.closest('#lvpage') && !e.target.closest('input')){ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; } else tsx=null; }, {passive:true});
document.addEventListener('touchend', e => { if(tsx==null || !S.session) return; const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy; tsx=null; if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5){ const i=(S.session.idx||0)+(dx<0?1:-1); if(i>=0 && i<S.session.blocks.length){ S.session.idx=i; ls.set('serie.session', S.session); render(); window.scrollTo(0,0); } } }, {passive:true});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update());
loadLib();
initData();
})();
</script>
