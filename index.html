<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3E6E2">
<title>#VemMonstro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VemMonstro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Série — neo-brutalista no estilo do Cofre: bordas grossas, sombras duras, condensada em caixa alta, números em mono. Verde + amarelo; vermelho só para alerta. */
:root{
  --ink:#1A0907; --bg:#F3E6E2; --paper:#FCF4F1; --card:#FFFFFF; --soft:#6E4A43;
  --g:#EE2B1B; --g2:#B3170B; --g3:#FF6F5C; --mint:#FFE1DA; --yellow:#FFF1EC; --lime:#FF8A78; --pink:#FFB4A8; --sky:#FFD4CB; --red:#C4120A;
  --display:"Bricolage Grotesque","Arial Black",Helvetica,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --b:3px solid var(--ink); --sh:4px 4px 0 var(--ink); --sh2:6px 6px 0 var(--ink);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(14px + var(--safe-t)) 0 calc(104px + var(--safe-b));position:relative}
.wrap{padding:0 16px}
/* app bar */
.top{margin:0 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--g);color:#fff;border:var(--b);border-radius:16px;box-shadow:var(--sh2);padding:10px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:76%;font-size:23px;white-space:nowrap;text-transform:uppercase;letter-spacing:.01em}
.brand i{display:grid;place-items:center;width:40px;height:40px;border:var(--b);border-radius:11px;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-4deg)}
.brand svg{width:26px;height:26px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-stretch:85%;font-size:13px;text-transform:uppercase;padding:8px 11px 8px 7px;border:var(--b);border-radius:11px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.back svg{width:16px;height:16px}
.ph{padding:18px 18px 16px}
.big{font-weight:800;font-stretch:76%;text-transform:uppercase;font-size:clamp(40px,12vw,58px);line-height:.9;margin:0;letter-spacing:-.005em;text-wrap:balance}
.lead{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 0;color:var(--soft)}
/* cards */
.card{background:var(--card);border:var(--b);border-radius:16px;box-shadow:var(--sh2);padding:18px;margin-bottom:18px;transition:transform .15s cubic-bezier(.2,.9,.3,1.4),box-shadow .15s}
.h2{font-weight:800;font-stretch:82%;text-transform:uppercase;font-size:20px;margin:0 0 14px}
.week{display:flex;justify-content:space-between;gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:7px;font-family:var(--mono);font-weight:500;font-size:12px}
.ring{width:40px;height:40px;border-radius:11px;border:var(--b);display:grid;place-items:center;background:var(--paper);font-weight:800;font-size:18px}
.ring.done{background:var(--g);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.ring.today{background:var(--ink);color:#fff;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--ink)}
.ring.today.done{background:var(--g)}
.ring svg{width:22px;height:22px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;border:var(--b);border-radius:16px;box-shadow:var(--sh2);padding:16px 18px;margin-bottom:18px}
.banner small{display:block;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.banner strong{display:block;font-weight:800;font-stretch:80%;font-size:24px;text-transform:uppercase;line-height:1;margin-top:4px}
.banner .num{font-family:var(--mono);font-size:44px;font-weight:500;line-height:1;color:var(--g3)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.tile{background:var(--card);color:var(--ink);border:var(--b);border-radius:16px;box-shadow:var(--sh2);padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:16px;min-height:128px;text-align:left;font-weight:800;font-stretch:80%;font-size:21px;text-transform:uppercase;line-height:.95;transition:transform .15s cubic-bezier(.2,.9,.3,1.4),box-shadow .15s}
.tile:active,.plan:active,.hist:active,.libi:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.tile:nth-child(1) .ico{background:var(--g)}.tile:nth-child(1) .ico svg,.tile:nth-child(4) .ico svg{color:#fff}.tile:nth-child(2) .ico{background:var(--pink)}.tile:nth-child(3) .ico{background:var(--sky)}.tile:nth-child(4) .ico{background:var(--ink)}
.ico{width:48px;height:48px;border-radius:12px;border:var(--b);background:var(--g);display:grid;place-items:center;flex:none;box-shadow:3px 3px 0 var(--ink);transition:transform .2s cubic-bezier(.2,.9,.3,1.6)}
.tile:hover .ico{transform:rotate(-8deg) scale(1.06)}
.ico svg{width:26px;height:26px;color:var(--ink)}
/* bottom nav */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));max-width:536px;margin:0 auto;background:var(--card);border:var(--b);border-radius:18px;box-shadow:var(--sh2);display:flex;justify-content:space-around;padding:7px;z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-stretch:85%;font-size:11.5px;text-transform:uppercase;padding:7px 2px;border-radius:11px;border:2.5px solid transparent;transition:transform .1s}
.nav button.on{background:var(--g);color:#fff;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);transform:rotate(-2deg)}
.nav svg{width:22px;height:22px}
/* plans & days */
.plan{display:flex;align-items:center;gap:14px;border:var(--b);border-radius:14px;padding:14px;margin-bottom:14px;width:100%;text-align:left;background:#fff;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.av{width:56px;height:56px;border-radius:12px;border:var(--b);background:var(--mint);display:grid;place-items:center;flex:none;color:var(--ink)}
.plan:nth-of-type(2n) .av{background:var(--yellow)}
.av svg{width:32px;height:32px}
.plan h3{margin:0 0 4px;font-weight:800;font-stretch:82%;font-size:22px;text-transform:uppercase;line-height:1}
.meta{color:var(--soft);font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:6px;margin-top:3px}
.chev{margin-left:auto}
.chev svg{width:22px;height:22px}
.dayc h3{margin:0;font-weight:800;font-stretch:78%;font-size:30px;text-transform:uppercase;line-height:.95}
.dayc .s{font-weight:600;margin:6px 0 12px}
.stat{display:inline-block;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;padding:4px 8px;border:2px solid var(--ink);border-radius:7px;background:var(--g);color:#fff}
.stat.no{background:var(--paper);color:var(--soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px;font-weight:900;font-stretch:82%;font-size:17px;text-transform:uppercase;width:100%;border:var(--b);background:var(--card);box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--g);color:#fff}
.btn.lime{background:var(--ink);color:#fff}
.btn.out{background:var(--card)}
.btn.ghost{background:var(--mint)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.45}
.startbar{margin:4px 16px 18px;background:var(--g);border:var(--b);border-radius:16px;box-shadow:var(--sh2);padding:16px;text-align:center}
.startbar .btn{background:#fff;font-size:22px;padding:14px}
.startbar p{margin:12px 0 0;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.block-h{display:inline-block;font-weight:800;font-stretch:85%;font-size:13px;text-transform:uppercase;padding:3px 9px;border:2px solid var(--ink);border-radius:7px;background:var(--g);color:#fff;transform:rotate(-1.5deg)}
.block-s{font-family:var(--mono);color:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 14px}
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .ex .thumb{width:92px;height:128px}
.carousel .ex{flex:0 0 88%;scroll-snap-align:center;border:var(--b);border-radius:14px;padding:14px;box-shadow:var(--sh);background:var(--paper)}
.ex{display:flex;gap:12px}
.ex .info{flex:1;min-width:0}
.ex h4{margin:0 0 10px;font-weight:800;font-stretch:84%;font-size:19px;text-transform:uppercase;line-height:1;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.badge{width:34px;height:34px;border-radius:10px;border:var(--b);background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;box-shadow:2px 2px 0 var(--ink);transform:rotate(-5deg)}
.kv{font-family:var(--mono);font-size:13.5px;line-height:1.75}
.kv b{font-family:var(--display);font-weight:800;font-stretch:85%;text-transform:uppercase;font-size:13px}
.note{margin-top:10px;font-size:13.5px;font-weight:600;padding:8px 10px;border:2px dashed var(--ink);border-radius:10px;background:var(--paper)}
.note b{display:block;font-family:var(--mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.thumb{width:112px;height:150px;border-radius:12px;overflow:hidden;position:relative;background:var(--mint);flex:none;border:var(--b);box-shadow:3px 3px 0 var(--ink)}
.thumb.sm{width:62px;height:62px;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}
.anim{position:absolute;inset:0}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.anim img.f1{opacity:0}
body.alt .anim img.f1{opacity:1}
body.alt .anim img.f0{opacity:0}
.play{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);background:var(--g);display:grid;place-items:center;color:#fff}
.play svg{width:14px;height:14px}
.noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;text-align:center;padding:6px}
.modal{position:fixed;inset:0;background:rgb(8 33 15 / .6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:#fff;border:var(--b);border-radius:18px;box-shadow:8px 8px 0 var(--ink);width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:18px;animation:pop .22s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.94) rotate(-1deg);opacity:0}}
.sheet.full{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));width:auto;max-width:540px;margin:0 auto;max-height:90vh}
.viewer{width:100%;aspect-ratio:3/2;position:relative;overflow:hidden;background:var(--mint);border-bottom:var(--b)}
.x{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:11px;border:var(--b);background:#fff;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;z-index:2}
.x svg{width:20px;height:20px}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center}
.setrow span{font-family:var(--mono);font-weight:500;text-align:center}
.setrow input{width:100%;border:var(--b);border-radius:10px;padding:9px 10px;background:#fff;font-family:var(--mono);font-size:16px;min-width:0;box-shadow:2px 2px 0 var(--ink)}
.setrow input:focus{outline:none;background:var(--mint)}
.setrow .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.chk{width:46px;height:46px;border-radius:12px;border:var(--b);display:grid;place-items:center;color:transparent;background:var(--paper);box-shadow:3px 3px 0 var(--ink);transition:transform .12s}
.chk.on{background:var(--g);color:#fff;transform:rotate(-6deg)}
.chk svg{width:24px;height:24px}
.ex.done-all h4 span:first-child{text-decoration:line-through;text-decoration-thickness:3px}
.timer{position:fixed;left:12px;right:12px;bottom:calc(92px + var(--safe-b));background:var(--ink);color:#fff;border:var(--b);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:30;max-width:536px;margin:0 auto;box-shadow:5px 5px 0 var(--g)}
.timer .t{font-family:var(--mono);font-size:28px;color:var(--g3);font-variant-numeric:tabular-nums;min-width:74px}
.timer .bar{flex:1;height:12px;border-radius:6px;border:2px solid #fff;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--g)}
.timer button{background:#fff;color:var(--ink);border:2px solid #fff;border-radius:9px;padding:7px 10px;font-weight:800;font-stretch:85%;text-transform:uppercase;font-size:13px}
.livebar{position:sticky;top:calc(6px + var(--safe-t));z-index:15;margin:0 16px 18px;background:var(--ink);color:#fff;border:var(--b);border-radius:14px;box-shadow:4px 4px 0 var(--g);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px 9px 14px;font-family:var(--mono);font-size:13px;text-transform:uppercase}
.livebar .clock{font-size:22px;color:var(--g3);font-variant-numeric:tabular-nums}
.livebar button{background:var(--g);color:#fff;border:2.5px solid #fff;border-radius:10px;padding:8px 12px;font-family:var(--display);font-weight:900;font-stretch:82%;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea,.field select{border:var(--b);border-radius:10px;padding:11px;background:#fff;width:100%;font-family:var(--mono);font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.field input:focus,.field textarea:focus{outline:none;background:var(--mint)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit-ex{border:var(--b);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;gap:12px;align-items:center;background:#fff;box-shadow:var(--sh)}
.edit-ex.linked{margin-top:-14px;border-top-left-radius:0;border-top-right-radius:0;border-top:3px dashed var(--ink);background:var(--paper)}
.edit-ex .nm{font-weight:800;font-stretch:85%;text-transform:uppercase;line-height:1.05}
.edit-ex .dt{font-family:var(--mono);font-size:11.5px;color:var(--soft);margin-top:4px}
.edit-ex input{font-family:var(--mono)}
.mini{display:flex;gap:6px;margin-left:auto}
.mini button{width:34px;height:34px;border-radius:9px;border:2px solid var(--ink);background:var(--card);box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center}
.mini svg{width:17px;height:17px}
.search{display:flex;gap:8px;align-items:center;border:var(--b);border-radius:12px;padding:3px 12px;background:#fff;margin-bottom:14px;box-shadow:3px 3px 0 var(--ink)}
.search input{border:0;outline:0;padding:10px 0;flex:1;background:transparent;font-family:var(--mono);font-size:15px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 10px 2px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:2.5px solid var(--ink);border-radius:9px;padding:6px 11px;font-weight:800;font-stretch:85%;font-size:13px;text-transform:uppercase;background:#fff;box-shadow:2px 2px 0 var(--ink)}
.chip.on{background:var(--g);color:#fff;transform:rotate(-1.5deg)}
.libi{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:2px solid var(--ink);width:100%;text-align:left}
.libi:last-of-type{border-bottom:0}
.libi .nm{font-weight:800;font-stretch:88%;font-size:16px;line-height:1.1}
.libi .dt{font-family:var(--mono);font-size:11.5px;color:var(--soft);margin-top:3px;text-transform:uppercase}
.hist{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:13px 0;border-bottom:2px solid var(--ink)}
.hist:last-child{border-bottom:0}
.hist div div:first-child{font-weight:800;font-stretch:85%;text-transform:uppercase;font-size:17px}
.date{width:56px;text-align:center;flex:none;background:var(--mint);border:var(--b);border-radius:11px;padding:6px 0;box-shadow:2px 2px 0 var(--ink)}
.date b{display:block;font-family:var(--mono);font-weight:500;font-size:22px;line-height:1}
.date small{font-family:var(--mono);font-size:10.5px;text-transform:uppercase}
.empty{text-align:center;padding:24px 10px;font-weight:600}
.empty svg{width:46px;height:46px;padding:9px;border:var(--b);border-radius:12px;background:var(--mint);box-shadow:3px 3px 0 var(--ink);margin-bottom:6px}
.empty .btn{margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%) rotate(-1deg);bottom:calc(100px + var(--safe-b));background:var(--ink);color:#fff;border:var(--b);box-shadow:4px 4px 0 var(--ink);padding:11px 16px;border-radius:12px;font-weight:800;font-stretch:85%;text-transform:uppercase;z-index:60;font-size:14px;white-space:nowrap}
.pill{display:inline-block;background:var(--mint);border:2px solid var(--ink);font-weight:800;font-size:11px;border-radius:6px;padding:1px 6px}
.toolbar{display:flex;gap:8px;justify-content:flex-end;margin:0 0 16px}
.toolbar button{background:#fff;border:var(--b);border-radius:11px;padding:8px 12px;font-weight:800;font-stretch:85%;text-transform:uppercase;font-size:13.5px;display:flex;gap:6px;align-items:center;box-shadow:3px 3px 0 var(--ink)}
.toolbar svg{width:16px;height:16px}
.link-toggle{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--g2);padding:2px 0 12px;display:flex;gap:6px;align-items:center}
.chart{width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:var(--b);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.kpi:nth-child(1){background:var(--g);color:#fff}.kpi:nth-child(2){background:var(--ink);color:#fff}
.kpi b{display:block;font-family:var(--mono);font-weight:500;font-size:22px}
.kpi small{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.sync{font-family:var(--mono);font-size:11px;text-transform:uppercase;text-align:center;margin-top:16px;color:var(--soft)}

.cats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:4px}
.cat{background:var(--card);border:var(--b);border-radius:16px;box-shadow:var(--sh2);padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;position:relative;transition:transform .12s,box-shadow .12s}
.cat:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.cat:nth-child(odd){transform:rotate(-.6deg)}.cat:nth-child(even){transform:rotate(.6deg)}
.cimg{display:block;position:relative;width:100%;aspect-ratio:4/3;border:var(--b);border-radius:11px;overflow:hidden}
.cn{font-weight:800;font-stretch:80%;font-size:21px;text-transform:uppercase;line-height:1;padding:2px 2px 4px}

let sb = null, user = null, saveTimer = null;
const pend = { get(){ return ls.get('serie.pending') || {plans:false, sessions:[], deletes:[]}; }, set(v){ ls.set('serie.pending', v); } };
async function flushPending(){
  if(!sb || !user || !navigator.onLine) return;
  const p = pend.get(); let changed = false;
  if(p.plans){ const { error } = await sb.from('user_plans').upsert({ user_id:user.id, plans:S.plans, updated_at:new Date().toISOString() }); if(!error){ p.plans=false; changed=true; } }
  for(const h of [...p.sessions]){ const { error } = await sb.from('sessions').upsert({ id:h.id, user_id:user.id, date:h.date, data:h }); if(!error){ p.sessions=p.sessions.filter(x=>x.id!==h.id); changed=true; } }
  for(const id of [...p.deletes]){ const { error } = await sb.from('sessions').delete().eq('id', id); if(!error){ p.deletes=p.deletes.filter(x=>x!==id); changed=true; } }
  if(changed){ pend.set(p); S.syncNote = (p.plans||p.sessions.length||p.deletes.length) ? 'Alterações pendentes — vão sincronizar quando voltar a internet' : ''; }
}
function savePlans(){
  ls.set('serie.plans', S.plans);
  const p = pend.get(); p.plans = true; pend.set(p);
  clearTimeout(saveTimer); saveTimer = setTimeout(flushPending, 500);
}
async function saveSession(h){
  S.history.unshift(h); S.history.sort((a,b)=> b.date.localeCompare(a.date)); ls.set('serie.history', S.history);
  const p = pend.get(); p.sessions.push(h); pend.set(p); await flushPending();
}
async function deleteSession(id){
  S.history = S.history.filter(h=>h.id!==id); ls.set('serie.history', S.history);
  const p = pend.get(); p.sessions = p.sessions.filter(x=>x.id!==id); p.deletes.push(id); pend.set(p); await flushPending();
}
async function saveProfile(pr){
  S.profile = pr; ls.set('serie.profile', pr);
  const { error } = await sb.from('profiles').upsert({ id:user.id, ...pr, updated_at:new Date().toISOString() });
  if(error){ toast('Erro ao salvar perfil: '+error.message); throw error; }
}
async function loadAll(){
  try{
    const [pr, pl, hs] = await Promise.all([
      sb.from('profiles').select('*').eq('id', user.id).maybeSingle(),
      sb.from('user_plans').select('plans').eq('user_id', user.id).maybeSingle(),
      sb.from('sessions').select('data').eq('user_id', user.id).order('date', {ascending:false}).limit(1000)
    ]);
    if(pr.error || pl.error || hs.error) throw (pr.error || pl.error || hs.error);
    const p = pend.get();
    S.profile = pr.data || null;
    if(!p.plans) S.plans = (pl.data && pl.data.plans) || [];
    const remote = hs.data.map(r => r.data);
    S.history = [...p.sessions.filter(x=>!remote.some(r=>r.id===x.id)), ...remote].filter(h=>!p.deletes.includes(h.id)).sort((a,b)=>b.date.localeCompare(a.date));
    ls.set('serie.profile', S.profile); ls.set('serie.plans', S.plans); ls.set('serie.history', S.history);
    S.syncNote = '';
    flushPending();
  }catch(e){
    console.warn(e);
    S.profile = ls.get('serie.profile'); S.plans = ls.get('serie.plans') || []; S.history = ls.get('serie.history') || [];
    S.syncNote = 'Sem internet — usando os dados salvos neste celular';
  }
  await splashWait();
  S.loaded = true;
  if(!S.profile) S.stack = [{v:'onboard'}];
  else if(['login','onboard','boot'].includes(cur().v)) S.stack = [{v:'home'}];
  render();
}
async function initData(){
  S.stack = [{v:'boot'}]; render();
  if(!window.supabase){ // sem internet na primeira abertura
    S.profile = ls.get('serie.profile'); S.plans = ls.get('serie.plans')||[]; S.history = ls.get('serie.history')||[];
    if(S.profile){ S.loaded=true; S.syncNote='Sem internet — usando os dados salvos neste celular'; S.stack=[{v:'home'}]; } else S.stack=[{v:'login'}];
    render(); return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  sb.auth.onAuthStateChange((ev, session) => {
    if(ev === 'PASSWORD_RECOVERY'){ user = session && session.user; S.stack = [{v:'newpass'}]; render(); }
  });
  const { data } = await sb.auth.getSession();
  if(!data.session){
    if(ls.get('serie.profile') && !navigator.onLine){ S.profile = ls.get('serie.profile'); S.plans = ls.get('serie.plans')||[]; S.history = ls.get('serie.history')||[]; S.loaded=true; S.stack=[{v:'home'}]; render(); return; }
    await splashWait(); S.stack = [{v:'login'}]; render(); return;
  }
  user = data.session.user;
  if(cur().v !== 'newpass') await loadAll();
}
window.addEventListener('online', () => { flushPending().then(()=>render()); });
async function logout(){
  await flushPending();
  try{ await sb.auth.signOut(); }catch(e){}
  ['serie.plans','serie.history','serie.profile','serie.session','serie.pending'].forEach(k=>ls.del(k));
  user=null; S.profile=null; S.plans=[]; S.history=[]; S.session=null;
  S.stack=[{v:'login'}]; render();
}

// ---------- exercise library & images ----------
let LIB = null, LIBMAP = {};
const chunkCache = {};
function loadLib(){ if(LIB) return Promise.resolve(LIB); return fetch('library.json').then(r=>r.json()).then(a => { LIB = a.map(x => ({id:x[0], name:x[1], equip:x[2], muscle:x[3], k:x[4]})); LIB.forEach(e=>LIBMAP[e.id]=e); return LIB; }).catch(()=> (LIB=[])); }
function chunkKey(id){ const c = id[0].toUpperCase(); return /[A-Z]/.test(c) ? c : '0'; }
function loadFrames(id){
  const k = chunkKey(id);
  if(!chunkCache[k]) chunkCache[k] = fetch('img/'+k+'.json').then(r=>r.json()).catch(()=>({}));
  return chunkCache[k].then(c => c[id] || null);
}
function animHTML(exId){
  if(!exId) return '<div class="noimg">sem vídeo</div>';
  return '<div class="anim" data-ex="'+esc(exId)+'"></div>';
}
function hydrateImages(root=document){
  root.querySelectorAll('.anim[data-ex]:not([data-done])').forEach(el => {
    el.dataset.done = '1';
    loadFrames(el.dataset.ex).then(fr => {
      if(!fr){ el.innerHTML = '<div class="noimg">sem vídeo</div>'; return; }
      el.innerHTML = fr.map((b,i) => '<img class="f'+i+'" alt="" src="data:image/webp;base64,'+b+'">').join('');
    });
  });
}

// ---------- derived ----------
function dayStats(planId, dayId){
  const hs = S.history.filter(h => h.planId===planId && h.dayId===dayId);
  return { n: hs.length, last: hs[0] ? hs[0].date : null };
}
function weekDays(){
  const now = new Date(); const dow = (now.getDay()+6)%7; const mon = new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-dow);
  const done = new Set(S.history.map(h => { const d=new Date(h.date); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }));
  return ['S','T','Q','Q','S','S','D'].map((l,i) => { const d = new Date(mon); d.setDate(mon.getDate()+i); return { l, done: done.has(d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()), today: i===dow }; });
}
function monthCount(){ const n=new Date(); return S.history.filter(h=>{const d=new Date(h.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).length; }
const findPlan = id => S.plans.find(p=>p.id===id);
const findDay = (p, id) => p && p.days.find(d=>d.id===id);

const pav = (p, cls='av') => { const k=pstyle(p); return '<span class="'+cls+'" style="background:'+k.c+';color:#fff">'+(I[k.ic]||I.dumb)+'</span>'; };
V.plans = () => header({title:'Treinos'}) +
  '<div class="wrap"><div class="card">' +
  (!S.loaded && !S.plans.length ? '<div class="empty">Carregando…</div>' :
   !S.plans.length ? '<div class="empty">'+I.dumb+'<p>Nenhum plano ainda.</p></div>' :
   S.plans.map(p => '<button class="plan" data-act="go" data-v="plan" data-plan="'+p.id+'" style="border-left:12px solid '+pstyle(p).c+'">'+pav(p)+'<div><h3>'+esc(p.name)+'</h3>'+
     (p.start||p.end ? '<div class="meta">'+I.cal+fmtDate(p.start)+' – '+fmtDate(p.end)+'</div>' : '')+
     '<div class="meta">'+esc([p.goal,p.level].filter(Boolean).join(' | '))+'</div></div><span class="chev">'+I.chev+'</span></button>').join('')) +
  '<button class="btn pri" data-act="go" data-v="gen" style="margin-bottom:12px">'+I.bolt+'Gerar treino recomendado</button><button class="btn ghost" data-act="newPlan">'+I.plus+'Montar do zero</button></div></div>' + nav('plans');

V.plan = ({plan}) => {
  const p = findPlan(plan); if(!p) return V.plans();
  return header({title:p.name, sub:[p.goal,p.level].filter(Boolean).join(' · ') + (p.start? ' · '+fmtDate(p.start)+' – '+fmtDate(p.end):'')}) +
  '<div class="wrap">' +
  '<div class="toolbar" style="justify-content:space-between;align-items:center">'+pav(p,'av sm')+'<button data-act="editPlan" data-plan="'+p.id+'">'+I.edit+'Editar plano</button></div>' +
  (p.guide && p.guide.length ? '<details class="card guide"'+(dayStats(p.id,(p.days[0]||{}).id).n?'':' open')+'><summary class="h2" style="margin:0">Como usar este treino</summary><ul>'+p.guide.map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul></details>' : '') +
  p.days.map(d => { const st = dayStats(p.id, d.id); const nEx = d.blocks.reduce((a,b)=>a+b.items.length,0);
    return '<div class="card dayc" style="border-top:12px solid '+pstyle(p).c+'"><h3>'+esc(d.title)+'</h3><div class="s">'+esc(d.subtitle||'')+(nEx? ' · '+nEx+' exercícios · ~'+dayMinutes(d)+' min':'')+'</div>'+
      (st.n ? '<div class="stat">Feito '+st.n+(st.n>1?' vezes':' vez')+', último em '+fmtDate(st.last)+'</div>' : '<div class="stat no">Você ainda não fez este treino</div>')+
      '<div class="row2"><button class="btn out" data-act="go" data-v="progress" data-plan="'+p.id+'" data-day="'+d.id+'">'+I.prog+'Progressão</button><button class="btn out" data-act="editDay" data-plan="'+p.id+'" data-day="'+d.id+'">'+I.edit+'Editar</button></div>'+
      '<button class="btn pri" style="background:'+pstyle(p).c+'" data-act="go" data-v="day" data-plan="'+p.id+'" data-day="'+d.id+'">Abrir treino</button></div>'; }).join('') +
  '</div>' + nav('plans');
};

function exView(it, badge){
  return '<div class="ex"><div class="info"><h4><span>'+esc(it.name)+'</span>'+(badge?'<span class="badge">'+badge+'</span>':'')+'</h4>'+
    (it.scheme&&it.scheme.length ? '<div class="kv">'+it.scheme.map(z=>'<b>1x'+esc(z.reps)+'</b> · '+esc(z.load||'—')).join('<br>')+'<br><b>Intervalo:</b> '+esc(it.rest)+'s</div>'
      : '<div class="kv"><b>Séries:</b> '+esc(it.sets)+'x'+esc(it.reps)+'<br><b>Carga:</b> '+esc(it.load||'—')+'<br><b>Intervalo:</b> '+esc(it.rest)+'s</div>')+
    (it.notes ? '<div class="note"><b>Instruções:</b>'+esc(it.notes)+'</div>' : '')+
    '</div><button class="thumb" data-act="viewEx" data-ex="'+esc(it.exId||'')+'" data-name="'+esc(it.name)+'" data-notes="'+esc(it.notes||'')+'">'+animHTML(it.exId)+(it.exId?'<span class="play">'+I.play+'</span>':'')+'</button></div>';
}
V.day = ({plan, day}) => {
  const p = findPlan(plan), d = findDay(p, day); if(!d) return V.plans();
  const live = S.session && S.session.planId===plan && S.session.dayId===day;
  return header({title:d.title, sub:d.subtitle}) +
  '<div class="startbar" style="background:'+pstyle(p).c+'"><div class="ptag">'+pav(p,'av xs')+esc(p.name)+'</div><button class="btn" data-act="start" data-plan="'+plan+'" data-day="'+day+'">'+(live?'Continuar treino':'Iniciar')+'</button><p>Modo visualização. Toque em INICIAR para começar o treino.</p></div>' +
  '<div class="wrap">' +
  (!d.blocks.length ? '<div class="card empty">'+I.dumb+'<p>Este treino ainda não tem exercícios.</p><button class="btn pri" data-act="editDay" data-plan="'+plan+'" data-day="'+day+'">'+I.plus+'Adicionar exercícios</button></div>' :
  d.blocks.map(b => b.items.length>1
    ? '<div class="card"><div class="block-h">Combinado</div><div class="block-s">Alterne estes exercícios</div><div class="carousel">'+b.items.map((it,i)=>exView(it,'ABCDEF'[i])).join('')+'</div></div>'
    : '<div class="card">'+exView(b.items[0])+'</div>').join('')) +
  '</div>' + nav('plans');
};

// ---- live workout ----
function startSession(planId, dayId){
  const p = findPlan(planId), d = findDay(p, dayId);
  if(S.session && !(S.session.planId===planId && S.session.dayId===dayId)){
    if(!confirmBox('Já existe um treino em andamento ('+S.session.dayTitle+'). Descartar e começar este?', () => { S.session=null; ls.del('serie.session'); startSession(planId, dayId); })) return;
  }
  if(!S.session){
    S.session = { id: uid(), planId, planName:p.name, dayId, dayTitle:d.title, daySub:d.subtitle||'', startedAt: Date.now(),
      blocks: d.blocks.map(b => ({ items: b.items.map(it => ({ key: it.id, exId: it.exId, name: it.name, rest: +it.rest||60, notes: it.notes||'', planLoad: it.load||'',
        sets: (it.scheme&&it.scheme.length) ? it.scheme.map(z=>({ reps:String(num(z.reps) ?? z.reps), load:String(num(z.load) ?? ''), done:false })) : Array.from({length: Math.max(1, +it.sets||1)}, () => ({ reps: String(num(it.reps) ?? it.reps ?? ''), load: String(num(it.load) ?? ''), done:false })), scheme: !!(it.scheme&&it.scheme.length) })) })) };
    ls.set('serie.session', S.session);
  }
  S.stack = [{v:'home'},{v:'live'}]; render(); window.scrollTo(0,0);
}
let confirmCb = null;
function confirmBox(msg, cb, okLabel='Confirmar', danger=false){
  confirmCb = cb;
  $('#layer').innerHTML = '<div class="modal" data-act="closeLayer"><div class="sheet" data-stop="1"><p style="font-size:17px;font-weight:600;margin:4px 0 18px">'+esc(msg)+'</p><div class="row2"><button class="btn out" data-act="closeLayer">Cancelar</button><button class="btn '+(danger?'danger':'pri')+'" data-act="confirmOk">'+esc(okLabel)+'</button></div></div></div>';
  return false;
}
V.live = () => {
  const s = S.session; if(!s) return V.home();
  const total = s.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+it.sets.length,0),0);
  const done = s.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+it.sets.filter(z=>z.done).length,0),0);
  const exLive = (it, bi, ii, badge) => {
    const all = it.sets.every(z=>z.done);
    return '<div class="ex'+(all?' done-all':'')+'" style="flex-direction:column"><div style="display:flex;gap:12px"><div class="info"><h4><span>'+esc(it.name)+'</span>'+(badge?'<span class="badge">'+badge+'</span>':'')+'</h4>'+
      '<div class="kv" style="font-size:14px"><b>Plano:</b> '+(it.scheme? it.sets.length+' séries variáveis' : it.sets.length+'x'+esc(it.sets[0].reps)+' · '+esc(it.planLoad||'—'))+' · '+it.rest+'s</div>'+(it.notes?'<div class="note">'+esc(it.notes)+'</div>':'')+'</div>'+
      '<button class="thumb sm" data-act="viewEx" data-ex="'+esc(it.exId||'')+'" data-name="'+esc(it.name)+'" data-notes="'+esc(it.notes)+'">'+animHTML(it.exId)+'</button></div>'+
      '<div class="sets"><div class="setrow"><span></span><span class="lbl">Reps</span><span class="lbl">Carga (kg)</span><span></span></div>'+
      it.sets.map((z,si)=>'<div class="setrow"><span>'+(si+1)+'</span><input inputmode="numeric" value="'+esc(z.reps)+'" data-in="reps" data-b="'+bi+'" data-i="'+ii+'" data-s="'+si+'"><input inputmode="decimal" value="'+esc(z.load)+'" data-in="load" data-b="'+bi+'" data-i="'+ii+'" data-s="'+si+'"><button class="chk'+(z.done?' on':'')+'" data-act="tick" data-b="'+bi+'" data-i="'+ii+'" data-s="'+si+'">'+I.check+'</button></div>').join('')+
      '</div></div>';
  };
  return header({title:s.dayTitle, sub:s.planName+(s.daySub?' · '+s.daySub:''), backAct:'home', backLabel:'Início'})+
  '<div class="livebar"><span class="clock" id="clock">'+fmtDur((Date.now()-s.startedAt)/1000)+'</span><span>'+done+'/'+total+' séries</span><button data-act="finish">Terminar</button></div>'+
  '<div class="wrap">'+
  s.blocks.map((b,bi)=> b.items.length>1
    ? '<div class="card"><div class="block-h">Combinado</div><div class="block-s">Alterne: faça uma série de cada e descanse no fim</div>'+b.items.map((it,ii)=>exLive(it,bi,ii,'ABCDEF'[ii])).join('<hr style="border:0;border-top:1.5px dashed var(--line);margin:16px 0">')+'</div>'
    : '<div class="card">'+exLive(b.items[0],bi,0)+'</div>').join('')+
  '<button class="btn" data-act="finish" style="margin-top:6px">Terminar treino</button></div>' + nav('plans') + timerHTML();
};
// rest timer
let rest = null; // {end, total}
function timerHTML(){ if(!rest) return ''; const left = Math.max(0,(rest.end-Date.now())/1000); return '<div class="timer" id="timer"><span class="t">'+fmtDur(left)+'</span><span class="bar"><i style="width:'+(100*left/rest.total)+'%"></i></span><button data-act="restAdd">+15s</button><button data-act="restSkip">Pular</button></div>'; }
setInterval(() => {
  const c = $('#clock'); if(c && S.session) c.textContent = fmtDur((Date.now()-S.session.startedAt)/1000);
  if(rest){
    const left = (rest.end-Date.now())/1000;
    if(left <= 0){ rest=null; const t=$('#timer'); t&&t.remove(); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} beep(); toast('Descanso acabou — próxima série!'); }
    else { const t=$('#timer'); if(t){ t.querySelector('.t').textContent = fmtDur(left); t.querySelector('.bar i').style.width = (100*left/rest.total)+'%'; } else if(cur().v==='live'){ document.getElementById('app').insertAdjacentHTML('beforeend', timerHTML()); } }
  }
}, 250);
let actx=null;
function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.35);}catch(e){} }

function finishFlow(){ go('finish', {endAt: Date.now()}); }
function sessionStats(s, endAt){
  const items = s.blocks.flatMap(b=>b.items);
  const done = items.flatMap(it=>it.sets.filter(z=>z.done));
  const exDone = items.filter(it=>it.sets.some(z=>z.done)).length;
  const reps = done.reduce((a,z)=>a+(num(z.reps)||0),0);
  const dur = Math.max(0,(endAt-s.startedAt)/1000);
  let bw = num(S.profile && S.profile.weight) || 75;
  const kcal = Math.round(5 * bw * dur/3600); // MET ~5 (musculação moderada a vigorosa)
  return { items, exTotal: items.length, exDone, sets: done.length, setsTotal: items.reduce((a,it)=>a+it.sets.length,0), reps, dur, kcal, bw, vol: Math.round(volume(s)) };
}
const hm = t => { const d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); };
V.finish = (st) => {
  const s = S.session; if(!s) return V.home();
  const k = sessionStats(s, st.endAt);
  const empty = k.sets===0;
  return header({title:'Terminar treino?', sub: s.dayTitle+(s.daySub?' · '+s.daySub:''), backAct:'back', backLabel:'Treino'}) +
  '<div class="wrap">'+
  '<div class="banner" style="flex-direction:column;align-items:stretch;gap:14px"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div><small>Horário</small><strong>'+hm(s.startedAt)+' → '+hm(st.endAt)+'</strong></div><div style="text-align:right"><small>Duração</small><div class="num" style="font-size:34px">'+fmtDur(k.dur)+'</div></div></div></div>'+
  '<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:18px">'+
    '<div class="kpi" style="background:#fff;color:var(--ink)"><b>'+k.exDone+'<span style="font-size:14px">/'+k.exTotal+'</span></b><small>exercícios</small></div>'+
    '<div class="kpi" style="background:#fff;color:var(--ink)"><b>'+k.sets+'<span style="font-size:14px">/'+k.setsTotal+'</span></b><small>séries</small></div>'+
    '<div class="kpi" style="background:#fff;color:var(--ink)"><b>'+k.reps+'</b><small>repetições</small></div>'+
    '<div class="kpi" style="background:#fff;color:var(--ink)"><b>'+k.vol.toLocaleString('pt-BR')+'</b><small>kg levantados</small></div>'+
    '<div class="kpi" style="grid-column:1/-1;background:var(--g);color:#fff"><b>~'+k.kcal+' kcal</b><small>estimativa · seu peso: '+k.bw+' kg'+(S.profile&&S.profile.weight?'':' (padrão — ajuste no perfil)')+'</small></div>'+
  '</div>'+
  (empty ? '<div class="note" style="margin:0 0 18px;background:#fff"><b>Atenção</b>Nenhuma série marcada. Se você só estava olhando, é só descartar.</div>' :
  '<div class="card" style="padding:14px 16px"><div class="h2" style="font-size:16px;margin-bottom:8px">Feito hoje</div>'+
    k.items.filter(it=>it.sets.some(z=>z.done)).map(it=>{ const d=it.sets.filter(z=>z.done); const mx=Math.max(...d.map(z=>num(z.load)||0)); return '<div class="meta" style="justify-content:space-between;color:var(--ink);font-size:12.5px;padding:5px 0;border-top:2px solid var(--line,#eee)"><span style="font-family:var(--display);font-weight:700;font-size:14px">'+esc(it.name)+'</span><span>'+d.length+'x · '+(mx? mx+'kg':'—')+'</span></div>'; }).join('')+
  '</div>'+
  '<label style="display:flex;gap:10px;align-items:center;font-weight:700;margin:0 0 18px"><input type="checkbox" id="upd" checked style="width:22px;height:22px;accent-color:#EE2B1B"> Atualizar as cargas do plano com as de hoje</label>')+
  (empty ? '' : '<button class="btn pri" data-act="finishOk" style="margin-bottom:12px;font-size:20px">Salvar treino</button>')+
  '<div class="row2"><button class="btn out" data-act="back">Continuar treino</button><button class="btn danger" data-act="discard">Descartar</button></div>'+
  '</div>' + nav('plans');
};
function volume(s){ return s.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+it.sets.filter(z=>z.done).reduce((y,z)=>y+(num(z.load)||0)*(num(z.reps)||0),0),0),0); }
async function finishOk(){
  const s = S.session; const upd = $('#upd') && $('#upd').checked; const endAt = cur().endAt || Date.now(); const k = sessionStats(s, endAt);
  const h = { id: s.id, date: new Date(endAt).toISOString(), planId: s.planId, planName: s.planName, dayId: s.dayId, dayTitle: s.dayTitle, daySub: s.daySub,
    startedAt: new Date(s.startedAt).toISOString(), durationSec: Math.round(k.dur), volume: k.vol, reps: k.reps, kcal: k.kcal, exercisesDone: k.exDone,
    exercises: s.blocks.flatMap(b=>b.items.map(it=>({ exId: it.exId||null, name: it.name, sets: it.sets.map(z=>({reps:z.reps, load:z.load, done:z.done})) }))) };
  if(upd){
    const p = findPlan(s.planId), d = findDay(p, s.dayId);
    if(d){ let changed=false; s.blocks.forEach(b=>b.items.forEach(it=>{ if(it.scheme) return; const done = it.sets.filter(z=>z.done && num(z.load)!=null); if(!done.length) return; const mx = Math.max(...done.map(z=>num(z.load)));
      d.blocks.forEach(pb=>pb.items.forEach(pi=>{ if(pi.id===it.key){ const old = num(pi.load); if(old!==mx){ pi.load = old==null ? mx+'kg' : String(pi.load).replace(/-?\d+([.,]\d+)?/, String(mx)); changed=true; } } })); }));
      if(changed) savePlans(); }
  }
  $('#layer').innerHTML=''; rest=null;
  S.session = null; ls.del('serie.session');
  await saveSession(h);
  S.stack = [{v:'home'},{v:'history'},{v:'session', id:h.id}]; render(); window.scrollTo(0,0);
  toast('Treino salvo 💪');
}

// ---- history ----
V.history = () => header({title:'Histórico'}) +
  '<div class="wrap"><div class="card">'+
  (!S.history.length ? '<div class="empty">'+I.hist+'<p>Nenhum treino registrado ainda.<br>Abra um treino e toque em Iniciar.</p></div>' :
  S.history.map(h => { const d = new Date(h.date); const sets = h.exercises.reduce((a,e)=>a+e.sets.filter(z=>z.done).length,0);
    return '<button class="hist" data-act="go" data-v="session" data-id="'+h.id+'"><span class="date"><b>'+pad(d.getDate())+'</b><small>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</small></span><div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(h.dayTitle)+(h.daySub?' · '+esc(h.daySub):'')+'</div><div class="meta">'+esc(h.planName)+' · '+fmtDur(h.durationSec)+' · '+sets+' séries</div></div><span class="chev">'+I.chev+'</span></button>'; }).join(''))+
  '</div></div>' + nav('history');
V.session = ({id}) => {
  const h = S.history.find(x=>x.id===id); if(!h) return V.history();
  return header({title:h.dayTitle, sub: fmtDate(h.date)+(h.startedAt?' · '+hm(h.startedAt)+'–'+hm(h.date):'')+' · '+h.planName}) +
  '<div class="wrap">'+(h.kcal!=null?'<div class="banner" style="padding:12px 16px"><div><small>Repetições</small><strong>'+h.reps+'</strong></div><div style="text-align:right"><small>Calorias (estim.)</small><strong>~'+h.kcal+' kcal</strong></div></div>':'')+'<div class="kpis" style="margin-bottom:14px"><div class="kpi"><b>'+fmtDur(h.durationSec)+'</b><small>duração</small></div><div class="kpi"><b>'+h.exercises.reduce((a,e)=>a+e.sets.filter(z=>z.done).length,0)+'</b><small>séries</small></div><div class="kpi"><b>'+(h.volume||0)+'</b><small>kg volume</small></div></div>'+
  h.exercises.map(e => '<div class="card"><div style="font-weight:700;margin-bottom:8px">'+esc(e.name)+'</div>'+e.sets.map((z,i)=>'<div class="meta" style="color:'+(z.done?'var(--ink)':'var(--mute)')+';font-size:15px">'+(z.done?'✓':'–')+' Série '+(i+1)+': '+esc(z.reps)+' reps × '+esc(z.load||'0')+' kg</div>').join('')+'</div>').join('')+
  '<button class="btn danger" data-act="delSession" data-id="'+h.id+'">Apagar registro</button></div>' + nav('history');
};

// ---- progress ----
V.progress = ({plan, day}) => {
  let names = [];
  const p = plan && findPlan(plan), d = p && findDay(p, day);
  if(d) names = d.blocks.flatMap(b=>b.items.map(i=>i.name));
  else names = [...new Set(S.history.flatMap(h=>h.exercises.map(e=>e.name)))];
  const sel = cur().sel && names.includes(cur().sel) ? cur().sel : names[0];
  const pts = sel ? S.history.slice().reverse().map(h => { const e = h.exercises.find(x=>x.name===sel); if(!e) return null; const ls_ = e.sets.filter(z=>z.done).map(z=>num(z.load)).filter(v=>v!=null); return ls_.length ? {date:h.date, v:Math.max(...ls_)} : null; }).filter(Boolean) : [];
  return header({title: d ? 'Progressão' : 'Meu progresso', sub: d ? d.title+' · '+(d.subtitle||'') : 'Carga máxima por exercício'}) +
  '<div class="wrap"><div class="card">'+
  (!names.length ? '<div class="empty">'+I.prog+'<p>Registre alguns treinos para ver sua evolução.</p></div>' :
   '<div class="chips">'+names.map(n=>'<button class="chip'+(n===sel?' on':'')+'" data-act="selProg" data-n="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div>'+
   (pts.length ? chartSVG(pts) + '<div class="meta" style="justify-content:space-between;margin-top:8px"><span>Primeiro: <b>'+pts[0].v+' kg</b></span><span>Atual: <b style="color:var(--g)">'+pts[pts.length-1].v+' kg</b></span></div>' : '<div class="empty"><p>Ainda sem registros de carga para este exercício.</p></div>'))+
  '</div></div>' + nav(d?'plans':'home');
};
function chartSVG(pts){
  const W=320,H=170,P=28; const vs=pts.map(p=>p.v); let mn=Math.min(...vs), mx=Math.max(...vs); if(mn===mx){mn-=5;mx+=5;}
  const x=i=> pts.length===1 ? W/2 : P+(W-2*P)*i/(pts.length-1), y=v=> H-P-(H-2*P)*(v-mn)/(mx-mn);
  const line = pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><line x1="'+P+'" x2="'+(W-P)+'" y1="'+(H-P)+'" y2="'+(H-P)+'" stroke="#DDE7E0"/>'+
    '<path d="'+line+'" fill="none" stroke="#EE2B1B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+

function pickEx(group, level, n, offset){
  if(group==='bracos'){ return [ ...pickEx(offset%2?'triceps':'biceps', level, n, offset) ]; }
  const L = EXDB[group].filter(e => e[3]==='a' || (level==='Iniciante' ? e[3]==='b' : e[3]==='m'));
  const out = []; for(let k=0; k<n && k<L.length; k++) out.push(L[(offset*n + k) % L.length]);
  return out;
}
function genPlan({goal='Hipertrofia', freq=4, level='Iniciante', style='split'}){
  freq = Math.min(6, Math.max(2, +freq||3));
  const cfg = GOALCFG[goal] || GOALCFG['Hipertrofia'], lv = level==='Iniciante' ? 'b' : 'm';
  const full = style==='full' || freq===2;
  const nDays = full ? Math.min(freq, 4) : freq;
  const titles = WEEK[full ? Math.max(2, nDays) : freq];
  const days = [];
  for(let d=0; d<nDays; d++){
    const layout = full ? FULL : SPLITS[freq][d];
    const variation = full ? d : (freq===6 && d>=3 ? 1 : 0);
    const items = [];
    layout.forEach(([g,n]) => pickEx(g, level, n, variation).forEach(e => {
      const [sets, reps, rest] = cfg[e[2]==='c'?'c':'i'][lv];
      items.push({ id: uid(), exId: e[1], name: e[0], sets: String(e[1]==='Plank'?3:sets), reps: e[1]==='Plank' ? '30-45s' : String(reps), load:'', rest:String(rest), notes:'' });
    }));
    if(items.length){ items[0].notes = 'Aquecimento: 1 série leve de 12–15 reps antes.'; }
    if(cfg.cardio) items.push({ id:uid(), exId:'Walking_Treadmill', name:'Cardio', sets:'1', reps:'20 min', load:'', rest:'0', notes:'Esteira inclinada, bike ou elíptico. Ritmo em que dá pra falar, mas com esforço.' });
    let blocks;

// ---------- events ----------
document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(stop && el.dataset.act==='closeLayer' && !stop.contains(el)===false && el.classList.contains('modal')) return;
  if(el.classList.contains('modal') && e.target !== el) return;
  const a = el.dataset.act, D = el.dataset;
  const st = cur();
  switch(a){
    case 'back': if(['editDay','editPlan'].includes(st.v)) S.editDraft=null; backTo(); break;
    case 'home': home(); break;
    case 'go': { const p={}; if(D.plan) p.plan=D.plan; if(D.day) p.day=D.day; if(D.id) p.id=D.id; if(D.v===cur().v && !D.plan && !D.id && !cur().cat && !cur().q){ return; } if(['plans','history','library'].includes(D.v) && ['plans','history','library','progress'].includes(cur().v)){ S.stack=[{v:'home'}]; } go(D.v,p); break; }
    case 'resume': S.stack=[{v:'home'},{v:'live'}]; render(); break;
    case 'start': startSession(D.plan, D.day); break;
    case 'viewEx': if(!D.ex){ toast('Este exercício ainda não tem vídeo'); break; } loadLib().then(()=>viewer(D.ex, D.name, D.notes)); break;
    case 'closeLayer': $('#layer').innerHTML=''; confirmCb=null; break;
    case 'confirmOk': { const cb=confirmCb; $('#layer').innerHTML=''; confirmCb=null; cb&&cb(); break; }
    case 'tick': { const z = S.session.blocks[+D.b].items[+D.i].sets[+D.s]; z.done=!z.done; ls.set('serie.session', S.session);
      if(z.done){ const b=S.session.blocks[+D.b]; const isLastInRound = +D.i===b.items.length-1; if(isLastInRound || b.items.length===1){ const r = b.items[+D.i].rest||60; rest={end:Date.now()+r*1000,total:r}; } }
      st.keepScroll=true; render(); break; }
    case 'restAdd': if(rest){ rest.end+=15000; rest.total+=15; } break;
    case 'restSkip': rest=null; { const t=$('#timer'); t&&t.remove(); } break;
    case 'finish': finishFlow(); break;
    case 'finishOk': finishOk(); break;
    case 'discard': confirmBox('Descartar este treino? Nada vai pro histórico.', ()=>{ S.session=null; rest=null; ls.del('serie.session'); home(); }, 'Descartar', true); break;
    case 'delSession': confirmBox('Apagar este registro do histórico?', async ()=>{ await deleteSession(D.id); backTo(); }, 'Apagar', true); break;
    case 'selProg': st.sel = D.n; render(); break;
    case 'libCat': go('library', {cat:D.c, pick:st.pick, b:st.b, i:st.i}); break;
    case 'libEq': st.eq = D.e; st.lim=40; render(); break;
    case 'full': fullView(D.ex, D.name); break;
    case 'closeFull': closeFull(); break;
    case 'fullPlay': fullPlay(!fullT); break;
    case 'fullToggle': fullPlay(false); setFrame(+($('#full').dataset.f)?0:1); break;
    case 'fullFrame': fullPlay(false); setFrame(+D.f); break;
    case 'libMore': st.lim=(st.lim||40)+40; st.keepScroll=true; render(); break;
    // plan editing
    case 'newPlan': S.editDraft={id:uid(),name:'Novo plano',goal:'Hipertrofia',level:'',start:'',end:'',days:[{id:uid(),title:'Treino A',subtitle:'',blocks:[]}]}; go('editPlan',{isNew:true}); break;
    case 'editPlan': S.editDraft=clone(findPlan(D.plan)); go('editPlan',{plan:D.plan}); break;
    case 'authMode': st.mode = D.m; st.err = st.msg = ''; render(); break;

    case 'pTpl': st.tpl = D.t; keepForm(()=>{ st.keepScroll=true; render(); }); break;
    case 'onboardOk': { const pr = readProfile(st); if(!pr) break; st.busy=true; render(); (async()=>{ try{ await saveProfile(pr); const tp = st.tpl ?? 'rec'; if(tp==='rec'){ S.plans.push(genPreview(st).plan); savePlans(); } else { const t = TEMPLATES.find(x=>x.id===tp); if(t && !S.plans.some(x=>x.id===t.id)){ S.plans.push(clone(t)); savePlans(); } } S.stack=[{v:'home'}]; render(); toast('Bem-vindo, '+pr.name.split(' ')[0]+'!'); }catch(e){ st.busy=false; render(); } })(); break; }

    case 'pColor': S.editDraft.color=D.c; st.keepScroll=true; render(); break;

    case 'dayAdd': S.editDraft.days.push({id:uid(),title:'Treino '+'ABCDEFGH'[S.editDraft.days.length]||'',subtitle:'',blocks:[]}); st.keepScroll=true; render(); break;

    case 'editDay': S.editDraft=clone(findDay(findPlan(D.plan), D.day)); go('editDay',{plan:D.plan,day:D.day}); break;

    case 'pickEx': case 'pickCustom': {
      const lib = LIBMAP[D.ex];
      while(S.stack.length>1 && cur().v==='library') S.stack.pop(); if(st.pick==='add'){ const it={id:uid(),exId:lib?lib.id:null,name:lib?lib.name:'Novo exercício',sets:'3',reps:'10',load:'',rest:'60',notes:''}; S.editDraft.blocks.push({id:uid(),items:[it]}); render(); itemSheet(S.editDraft.blocks.length-1,0); }
      else { const it=S.editDraft.blocks[st.b].items[st.i]; if(lib){ it.exId=lib.id; if(!it.name||it.name==='Novo exercício') it.name=lib.name; } else it.exId=null; const b=st.b,i=st.i; render(); itemSheet(b,i); }
      break; }
    case 'saveDay': { const p=findPlan(st.plan); const i=p.days.findIndex(x=>x.id===st.day); p.days[i]=S.editDraft; S.editDraft=null; savePlans(); backTo(); toast('Treino salvo'); break; }
  }
});
function moveItem(bi, ii, dir){
  const bs=S.editDraft.blocks, b=bs[bi];
  if(b.items.length>1){ const j=ii+dir; if(j>=0 && j<b.items.length){ [b.items[ii],b.items[j]]=[b.items[j],b.items[ii]]; return; } }
  const nb=bi+dir; if(nb<0||nb>=bs.length) return;
  if(b.items.length===1){ [bs[bi],bs[nb]]=[bs[nb],bs[bi]]; }
  else { const it=b.items.splice(ii,1)[0]; bs.splice(dir>0?bi+1:bi,0,{id:uid(),items:[it]}); }
}
document.addEventListener('input', e => {
  const t=e.target; const st=cur();
  if(t.id==='libq'){ st.q=t.value; st.lim=40; st.focus=true; clearTimeout(t._d); t._d=setTimeout(()=>render(),200); return; }
  if(t.dataset.in && S.session){ S.session.blocks[+t.dataset.b].items[+t.dataset.i].sets[+t.dataset.s][t.dataset.in]=t.value; ls.set('serie.session', S.session);
    // propagate load to following unchecked sets
    if(t.dataset.in==='load' && !S.session.blocks[+t.dataset.b].items[+t.dataset.i].scheme){ const it=S.session.blocks[+t.dataset.b].items[+t.dataset.i]; it.sets.forEach((z,si)=>{ if(si>+t.dataset.s && !z.done){ z.load=t.value; const inp=document.querySelector('input[data-in="load"][data-b="'+t.dataset.b+'"][data-i="'+t.dataset.i+'"][data-s="'+si+'"]'); if(inp) inp.value=t.value; } }); }
    return; }
  if(t.dataset.pf && S.editDraft){ S.editDraft[t.dataset.pf]=t.value; return; }
  if(t.dataset.df && S.editDraft){ S.editDraft.days[+t.dataset.i][t.dataset.df]=t.value; return; }
});


// preserva o que foi digitado quando re-renderiza formulários
function keepForm(fn){ const vals = {}; document.querySelectorAll('#app input[id]').forEach(i=>vals[i.id]=i.value); fn(); Object.entries(vals).forEach(([k,v])=>{ const i=document.getElementById(k); if(i) i.value=v; }); }
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id==='authf') authSubmit();
  if(e.target.id==='newpassf'){ const v=$('#np').value; sb.auth.updateUser({password:v}).then(r=>{ if(r.error){ cur().err=r.error.message; render(); } else { toast('Senha atualizada'); loadAll(); } }); }
});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update());
loadLib();
initData();
})();
</script>
