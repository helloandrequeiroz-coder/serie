<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F4">
<title>#VemMonstro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" as="image" href="icons/logo.webp">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VemMonstro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* #VemMonstro — visual limpo, pensado pra usar na academia: alvos grandes, contraste alto, vermelho só para ação. */
:root{
  --bg:#F6F5F4; --card:#FFFFFF; --ink:#111111; --soft:#5F5955; --line:#ECEAE8; --paper:#F6F5F4;
  --g:#E8291C; --g2:#B91C10; --g3:#FF6B5B; --mint:#FDECEA; --ok:#16A34A; --red:#DC2626;
  --display:"Bricolage Grotesque","Arial Narrow",Helvetica,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --r:20px; --sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.3}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(8px + var(--safe-t)) 0 calc(96px + var(--safe-b));position:relative}
.wrap{padding:0 16px}
svg{flex:none}
/* cabeçalho */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;min-height:56px}
.hd-r{display:flex;gap:8px;align-items:center}
.icb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh)}
.icb svg{width:22px;height:22px}
.icb.lg{width:56px;height:56px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-weight:600;font-size:14px}
.chipbtn svg{width:18px;height:18px}
.ph{padding:2px 20px 16px}
.big{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:clamp(32px,9vw,42px);line-height:1;margin:0;letter-spacing:-.01em;text-transform:none;text-wrap:balance}
.lead{font-size:16px;color:var(--soft);margin:8px 0 0}
.home-hd{padding:10px 16px 14px}
.hello{display:flex;gap:12px;align-items:center}
.hello small{display:block;color:var(--soft);font-size:15px}
.hello b{font-family:var(--display);font-weight:800;font-stretch:82%;font-size:28px;line-height:1.05}
.logo-sm{width:52px;height:52px;object-fit:contain}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:18px}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.t,.h2{display:block;font-weight:700;font-size:17px;margin:0 0 12px}
.sec-t{display:block;font-family:var(--display);font-weight:800;font-stretch:85%;font-size:22px;margin:22px 4px 10px}
.row-b{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.row-b .t{margin:0}
.pill2{font-size:15px;font-weight:600;background:var(--mint);color:var(--g2);padding:5px 10px;border-radius:999px}
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:22px 20px 20px;margin-bottom:14px}
.hero small{display:block;font-size:15px;color:#A8A29E;font-weight:500}
.hero h2{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:34px;line-height:1;margin:8px 0 6px}
.hero p{margin:0 0 18px;color:#D6D3D1;font-size:16px}
.hero .btn.soft{background:#262626;color:#fff}
.hero.live{background:var(--g)}
.hero.live small,.hero.live p{color:#FFE3E0}
.week{display:flex;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:var(--soft);font-weight:600}
.wd.today{color:var(--ink)}
.ring{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:#fff}
.wd.today .ring{box-shadow:inset 0 0 0 2px var(--ink)}
.ring.done{background:var(--g)}
.ring svg{width:20px;height:20px}
.stats{font-family:var(--body);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stats>div{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px 12px}
.stats b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b i{font-style:normal;font-size:14px;color:var(--soft);font-weight:500}
.stats small{display:block;font-size:14px;color:var(--soft);font-weight:500;margin-top:2px}
.stats.big{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.big b{font-size:26px}
/* listas */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:64px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>.exrow:first-child,.list>.combo:first-child{border-top:0}
.row.big{min-height:76px}
.row:active,.exrow:active{background:#FAFAF9}
.row>svg{width:20px;height:20px;color:#A8A29E}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-m b{font-weight:600;font-size:17px;line-height:1.25}
.row-m small{font-size:15px;color:var(--soft)}
.row-m em{font-style:normal;font-size:14px;color:var(--g2);margin-top:2px}
.av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;background:var(--g)}
.av svg{width:26px;height:26px;color:#fff}
.av.sm{width:40px;height:40px}.av.xs{width:28px;height:28px;border-radius:8px}.av.xs svg{width:16px;height:16px}
.daytag{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:13px;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grp-l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);padding:16px 4px 4px}
.date{width:48px;text-align:center;flex:none;background:var(--bg);border-radius:12px;padding:6px 0}
.date b{display:block;font-size:19px;font-weight:700;line-height:1}
.date small{font-size:12px;text-transform:uppercase;color:var(--soft)}
.exrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.exrow .thumb{width:64px;height:64px;border-radius:14px}
.combo{border-top:1px solid var(--line);border-left:4px solid var(--g)}
.combo .exrow{border-top:0}
.combo-l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g2);padding:12px 14px 0}
.ab{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;margin-bottom:2px}
.thumb{position:relative;display:block;width:56px;height:56px;border-radius:12px;overflow:hidden;background:#EFEDEB;flex:none}
.thumb.sm{width:56px;height:56px}
.anim{position:absolute;inset:0}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.anim img.f1{opacity:0}
body.alt .anim img.f1{opacity:1}
body.alt .anim img.f0{opacity:0}
.noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;color:var(--soft);text-align:center;padding:4px}
.play{display:none}
/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;min-height:52px;padding:0 18px;font-weight:700;font-size:16px;width:100%;background:var(--card);box-shadow:var(--sh)}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--g);color:#fff;box-shadow:0 6px 18px rgba(232,41,28,.28)}
.btn.soft{background:#EFEDEB;box-shadow:none}
.btn.ghost{background:var(--mint);color:var(--g2);box-shadow:none}
.btn.danger{background:var(--red);color:#fff}
.btn.ghostdanger{background:transparent;box-shadow:none;color:var(--red)}
.btn.xl{min-height:60px;font-size:18px;border-radius:18px}
.btn.out{background:var(--card)}
.btn.lime{background:var(--ink);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.txtbtn{font-weight:700;color:var(--g);padding:10px 6px}
.sticky-cta{position:fixed;left:0;right:0;bottom:calc(74px + var(--safe-b));padding:12px 16px;max-width:560px;margin:0 auto;background:linear-gradient(transparent,var(--bg) 30%);z-index:15}
/* menu */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + var(--safe-b));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600;color:#8A847F;padding:6px 0;min-height:56px;justify-content:center}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--g)}
.nav svg{width:26px;height:26px}
/* treino ao vivo */
.lv{padding-bottom:110px}
.lv-top{display:flex;align-items:center;justify-content:space-between;padding:4px 12px}
.lv-c{text-align:center}
.lv-c b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.lv-c small{font-size:14px;color:var(--soft)}
.segs{display:flex;gap:4px;padding:10px 16px 6px}
.segs{padding:6px 16px 4px}
.segs button{flex:1;height:22px;min-width:0;background:none;position:relative}
.segs button::after{content:'';position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:#E7E5E4}
.segs button.ok::after{background:var(--ink)}
.segs button.cur::after{background:var(--g)}
.lv-page{padding:4px 16px 0}
.lv-count{font-size:15px;color:var(--soft);font-weight:500;margin:6px 4px 12px}
.lv-count b{color:var(--ink);font-weight:700}
.lv-media{position:relative;display:block;width:100%;aspect-ratio:16/11;border-radius:20px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.lv-media .anim img{object-fit:contain;background:#fff}
.fsb{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:rgba(17,17,17,.7);color:#fff;display:grid;place-items:center}
.fsb svg{width:18px;height:18px}
.lv-name{font-family:var(--display);font-weight:800;font-stretch:82%;font-size:30px;line-height:1.05;margin:16px 4px 6px}
.lv-mini{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.lv-mini .thumb{width:76px;height:76px;border-radius:16px}
.lv-mini h2{font-family:var(--display);font-weight:800;font-stretch:84%;font-size:22px;line-height:1.05;margin:4px 0 0}
.lv-meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 4px 8px}
.lv-meta span{font-size:15px;font-weight:600;background:#EFEDEB;border-radius:999px;padding:5px 10px}
.lv-note{margin:4px 4px 10px;font-size:15px;color:var(--g2);font-weight:500}
.lv-last{display:flex;gap:8px;align-items:flex-start;background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:15px;color:var(--soft);box-shadow:var(--sh)}
.lv-last svg{width:18px;height:18px;margin-top:1px}
.lv-last b{color:var(--ink);font-weight:600}
.lv-ex{margin-bottom:6px}
.combo-sep{text-align:center;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:14px 0}
.sets{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:22px 1fr 1fr 56px;gap:8px;align-items:center;background:var(--card);border-radius:18px;padding:8px 8px 8px 12px;box-shadow:var(--sh);width:100%;text-align:left}
.srow.cur{box-shadow:0 0 0 2px var(--ink),var(--sh)}
.srow.done{grid-template-columns:22px 1fr 56px;background:#F0FDF4;box-shadow:none;min-height:60px}
.sn{font-weight:700;color:var(--soft);font-size:17px;text-align:center}
.sdone{font-weight:600;font-size:17px;color:#166534;font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;background:var(--bg);border-radius:14px;height:56px;min-width:0}
.stp button{width:36px;height:56px;font-size:24px;font-weight:500;color:var(--ink);flex:none}
.stp button:active{background:#E7E5E4;border-radius:12px}
.stp label{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;padding:0;outline:0}
.stp small{font-size:12px;color:var(--soft);font-weight:600;margin-top:2px}
.chk{width:56px;height:56px;border-radius:16px;background:var(--bg);color:#A8A29E;display:grid;place-items:center;border:2px solid #E7E5E4}
.chk svg{width:26px;height:26px}
.srow.cur .chk{background:var(--g);border-color:var(--g);color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.lv-foot{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:stretch;padding:12px 16px calc(12px + var(--safe-b));background:var(--bg);border-top:1px solid var(--line);z-index:15}
.lv-foot .prev{width:64px;flex:none;border-radius:18px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink)}
.lv-foot .prev svg{width:28px;height:28px}
.lv-foot .prev:disabled{opacity:.25}
.lv-foot .nx{flex:1;width:auto;min-width:0;justify-content:space-between;text-align:left;min-height:68px;border-radius:18px;background:var(--ink);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:0 10px 0 18px}
.lv-foot .nx.go{background:var(--g);box-shadow:0 6px 18px rgba(232,41,28,.35);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.lv-foot .nx .arr{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.lv-foot .nx .arr svg{width:24px;height:24px}
.lv-foot .nx span{display:flex;flex-direction:column;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lv-foot .nx small{font-size:13px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.lv-foot .nx span{font-size:17px}
.lv{padding-bottom:130px}
/* descanso */
.rest{position:fixed;inset:0;z-index:60;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + var(--safe-t)) 24px calc(24px + var(--safe-b));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.rest>small{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#A8A29E}
.ringwrap{position:relative;width:min(72vw,300px);aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:#262626;stroke-width:12}
.rp{fill:none;stroke:var(--g);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,18vw,80px);font-weight:700;font-variant-numeric:tabular-nums}
.rnext{margin:0;text-align:center;color:#E7E5E4;font-size:18px;font-weight:500;max-width:320px}
.radj{display:flex;gap:12px}
.radj button{width:96px;height:52px;border-radius:16px;background:#262626;font-weight:700;font-size:16px}
.rskip{background:#fff;color:#111;max-width:340px;margin-top:6px}
/* formulários */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:15px;font-weight:600;color:var(--soft)}
.field input,.field textarea,.field select,.sel{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;width:100%;font-size:16px}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--ink)}
.sel{margin-bottom:12px;font-weight:600;appearance:auto}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px;background:#EFEDEB;min-height:42px}
.chip.on{background:var(--ink);color:#fff}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:#EFEDEB;border-radius:14px;padding:4px;margin-bottom:16px}
.seg2 button{padding:11px;border-radius:11px;font-weight:600;font-size:15px}
.seg2 button.on{background:#fff;box-shadow:var(--sh)}
.check{display:flex;gap:12px;align-items:center;font-weight:500;font-size:16px;margin:4px 4px 18px}
.check input{width:22px;height:22px;accent-color:var(--g)}
.hint{color:var(--soft);font-size:16px;margin:0 4px 18px}
.kvrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.kvrow:first-of-type{border-top:0}
.red{color:var(--g)}
.hx{padding:10px 0;border-top:1px solid var(--line)}.hx:first-child{border-top:0}
.hx b{font-weight:600}
.hx div{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hx span{font-size:13px;background:var(--bg);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums}
/* editor */
.edit-ex{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:var(--sh)}
.edit-ex.linked{margin-top:-4px;border-left:4px solid var(--g)}
.edit-ex .nm{font-weight:600;line-height:1.25}
.edit-ex .dt{font-size:15px;color:var(--soft);margin-top:2px}
.edit-ex input{border:1.5px solid var(--line)!important;border-radius:12px!important}
.mini{display:flex;gap:6px;margin-left:auto}
.mini button{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center}
.mini svg{width:18px;height:18px}
.link-toggle{font-size:13.5px;font-weight:600;color:var(--g);padding:6px 4px 12px;display:flex;gap:6px;align-items:center}
.pill{display:inline-block;background:var(--mint);color:var(--g2);font-weight:700;font-size:11px;border-radius:6px;padding:2px 6px}
.toolbar{display:flex;gap:8px;justify-content:flex-end;margin:0 0 12px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.sw svg{width:22px;height:22px}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
/* biblioteca */
.search{display:flex;gap:8px;align-items:center;background:#fff;border-radius:16px;padding:4px 14px;margin-bottom:14px;box-shadow:var(--sh)}
.search input{border:0;outline:0;padding:12px 0;flex:1;background:transparent;font-size:16px;min-width:0}
.cats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cat{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:8px;display:flex;flex-direction:column;gap:8px;text-align:left;position:relative}
.cimg{display:block;position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#EFEDEB!important}
.cn{font-weight:700;font-size:17px;padding:0 4px 4px}

let sb = null, user = null, saveTimer = null;
const pend = { get(){ return ls.get('serie.pending') || {plans:false, sessions:[], deletes:[]}; }, set(v){ ls.set('serie.pending', v); } };
async function flushPending(){
  if(!sb || !user || !navigator.onLine) return;
  const p = pend.get(); let changed = false;
  if(p.plans){ const { error } = await sb.from('user_plans').upsert({ user_id:user.id, plans:S.plans, updated_at:new Date().toISOString() }); if(!error){ p.plans=false; changed=true; } }
  for(const h of [...p.sessions]){ const { error } = await sb.from('sessions').upsert({ id:h.id, user_id:user.id, date:h.date, data:h }); if(!error){ p.sessions=p.sessions.filter(x=>x.id!==h.id); changed=true; } }
  for(const id of [...p.deletes]){ const { error } = await sb.from('sessions').delete().eq('id', id); if(!error){ p.deletes=p.deletes.filter(x=>x!==id); changed=true; } }
  if(changed){ pend.set(p); S.syncNote = (p.plans||p.sessions.length||p.deletes.length) ? 'Alterações pendentes — vão sincronizar quando voltar a internet' : ''; }
}
function savePlans(){
  ls.set('serie.plans', S.plans);
  const p = pend.get(); p.plans = true; pend.set(p);
  clearTimeout(saveTimer); saveTimer = setTimeout(flushPending, 500);
}
async function saveSession(h){
  S.history.unshift(h); S.history.sort((a,b)=> b.date.localeCompare(a.date)); ls.set('serie.history', S.history);
  const p = pend.get(); p.sessions.push(h); pend.set(p); await flushPending();
}
async function deleteSession(id){
  S.history = S.history.filter(h=>h.id!==id); ls.set('serie.history', S.history);
  const p = pend.get(); p.sessions = p.sessions.filter(x=>x.id!==id); p.deletes.push(id); pend.set(p); await flushPending();
}
async function saveProfile(pr){
  S.profile = pr; ls.set('serie.profile', pr);
  const { error } = await sb.from('profiles').upsert({ id:user.id, ...pr, updated_at:new Date().toISOString() });
  if(error){ toast('Erro ao salvar perfil: '+error.message); throw error; }
}
async function loadAll(){
  try{
    const [pr, pl, hs] = await Promise.all([
      sb.from('profiles').select('*').eq('id', user.id).maybeSingle(),
      sb.from('user_plans').select('plans').eq('user_id', user.id).maybeSingle(),
      sb.from('sessions').select('data').eq('user_id', user.id).order('date', {ascending:false}).limit(1000)
    ]);
    if(pr.error || pl.error || hs.error) throw (pr.error || pl.error || hs.error);
    const p = pend.get();
    S.profile = pr.data || null;
    if(!p.plans) S.plans = (pl.data && pl.data.plans) || [];
    const remote = hs.data.map(r => r.data);
    S.history = [...p.sessions.filter(x=>!remote.some(r=>r.id===x.id)), ...remote].filter(h=>!p.deletes.includes(h.id)).sort((a,b)=>b.date.localeCompare(a.date));
    ls.set('serie.profile', S.profile); ls.set('serie.plans', S.plans); ls.set('serie.history', S.history);
    S.syncNote = '';
    flushPending();
  }catch(e){
    console.warn(e);
    S.profile = ls.get('serie.profile'); S.plans = ls.get('serie.plans') || []; S.history = ls.get('serie.history') || [];
    S.syncNote = 'Sem internet — usando os dados salvos neste celular';
  }
  await splashWait();
  S.loaded = true;
  if(!S.profile) S.stack = [{v:'onboard'}];
  else if(['login','onboard','boot'].includes(cur().v)) S.stack = [{v:'home'}];
  render();
}
async function initData(){
  S.stack = [{v:'boot'}]; render();
  if(!window.supabase){ // sem internet na primeira abertura
    S.profile = ls.get('serie.profile'); S.plans = ls.get('serie.plans')||[]; S.history = ls.get('serie.history')||[];
    if(S.profile){ S.loaded=true; S.syncNote='Sem internet — usando os dados salvos neste celular'; S.stack=[{v:'home'}]; } else S.stack=[{v:'login'}];
    render(); return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  sb.auth.onAuthStateChange((ev, session) => {
    if(ev === 'PASSWORD_RECOVERY'){ user = session && session.user; S.stack = [{v:'newpass'}]; render(); }
  });
  const { data } = await sb.auth.getSession();
  if(!data.session){
    if(ls.get('serie.profile') && !navigator.onLine){ S.profile = ls.get('serie.profile'); S.plans = ls.get('serie.plans')||[]; S.history = ls.get('serie.history')||[]; S.loaded=true; S.stack=[{v:'home'}]; render(); return; }
    await splashWait(); S.stack = [{v:'login'}]; render(); return;
  }
  user = data.session.user;
  if(cur().v !== 'newpass') await loadAll();
}
window.addEventListener('online', () => { flushPending().then(()=>render()); });
async function logout(){
  await flushPending();
  try{ await sb.auth.signOut(); }catch(e){}
  ['serie.plans','serie.history','serie.profile','serie.session','serie.pending'].forEach(k=>ls.del(k));
  user=null; S.profile=null; S.plans=[]; S.history=[]; S.session=null;
  S.stack=[{v:'login'}]; render();
}

const chunkCache = {};
function loadLib(){ if(LIB) return Promise.resolve(LIB); return fetch('library.json').then(r=>r.json()).then(a => { LIB = a.map(x => ({id:x[0], name:x[1], equip:x[2], muscle:x[3], k:x[4]})); LIB.forEach(e=>LIBMAP[e.id]=e); return LIB; }).catch(()=> (LIB=[])); }
function chunkKey(id){ const c = id[0].toUpperCase(); return /[A-Z]/.test(c) ? c : '0'; }
function loadFrames(id){
  const k = chunkKey(id);
  if(!chunkCache[k]) chunkCache[k] = fetch('img/'+k+'.json').then(r=>r.json()).catch(()=>({}));
  return chunkCache[k].then(c => c[id] || null);
}
function animHTML(exId){
  if(!exId) return '<div class="noimg">sem vídeo</div>';
  return '<div class="anim" data-ex="'+esc(exId)+'"></div>';
}
function hydrateImages(root=document){
  root.querySelectorAll('.anim[data-ex]:not([data-done])').forEach(el => {
    el.dataset.done = '1';
    loadFrames(el.dataset.ex).then(fr => {
      if(!fr){ el.innerHTML = '<div class="noimg">sem vídeo</div>'; return; }
      el.innerHTML = fr.map((b,i) => '<img class="f'+i+'" alt="" src="data:image/webp;base64,'+b+'">').join('');

function dayStats(planId, dayId){
  const hs = S.history.filter(h => h.planId===planId && h.dayId===dayId);
  return { n: hs.length, last: hs[0] ? hs[0].date : null };
}
function weekDays(){
  const now = new Date(); const dow = (now.getDay()+6)%7; const mon = new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-dow);
  const done = new Set(S.history.map(h => { const d=new Date(h.date); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }));
  return ['S','T','Q','Q','S','S','D'].map((l,i) => { const d = new Date(mon); d.setDate(mon.getDate()+i); return { l, done: done.has(d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()), today: i===dow }; });
}
function monthCount(){ const n=new Date(); return S.history.filter(h=>{const d=new Date(h.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).length; }

// próximo treino: plano usado por último, dia seguinte ao último feito
function nextWorkout(){
  if(!S.plans.length) return null;
  const lastH = S.history.find(h => findPlan(h.planId));
  const p = lastH ? findPlan(lastH.planId) : S.plans[0];
  if(!p || !p.days.length) return null;
  const lastDone = S.history.find(h => h.planId===p.id);
  let i = lastDone ? p.days.findIndex(d=>d.id===lastDone.dayId) + 1 : 0;
  if(i < 0 || i >= p.days.length) i = 0;
  const d = p.days[i];
  return { p, d, lastDate: dayStats(p.id, d.id).last };
}

function lastSets(it){

function startSession(planId, dayId){
  const p = findPlan(planId), d = findDay(p, dayId);

    S.session = { id: uid(), planId, planName:p.name, dayId, dayTitle:d.title, daySub:d.subtitle||'', startedAt: Date.now(), idx: 0,
      blocks: d.blocks.map(b => ({ items: b.items.map(it => {
        const last = lastSets(it); const planSets = (it.scheme&&it.scheme.length) ? it.scheme.map(z=>({reps:z.reps, load:z.load})) : Array.from({length: Math.max(1, +it.sets||1)}, () => ({reps: it.reps, load: it.load}));
        return { key: it.id, exId: it.exId, name: it.name, rest: +it.rest||60, notes: it.notes||'', planLoad: it.load||'', target: (it.scheme&&it.scheme.length) ? 'pirâmide/drop' : (it.sets+' × '+it.reps),

          scheme: !!(it.scheme&&it.scheme.length) };

let rest = null; // {end,total,label}
function restHTML(){

  return '<div class="rest" id="rest"><small>Descanso</small><div class="ringwrap"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="120" class="rt"/><circle cx="130" cy="130" r="120" class="rp" id="rp" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-left/rest.total))+'"/></svg><b id="restT">'+fmtDur(left)+'</b></div>'+
    '<p class="rnext">'+esc(rest.label||'')+'</p><div class="radj"><button data-act="restAdd" data-d="-15">−15s</button><button data-act="restAdd" data-d="15">+15s</button></div><button class="btn xl rskip" data-act="restSkip">Pular descanso</button></div>';
}
function startRest(secs, label){ if(!secs) return; rest = { end: Date.now()+secs*1000, total: secs, label }; }
setInterval(() => {
  const c = $('#clock'); if(c && S.session) c.textContent = fmtDur((Date.now()-S.session.startedAt)/1000);
  if(rest){
    const left = (rest.end-Date.now())/1000;
    if(left <= 0){ rest=null; const t=$('#rest'); t&&t.remove(); try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){} beep(); toast('Bora! Próxima série 💪'); }
    else { const t=$('#restT'), rp=$('#rp'); if(t){ t.textContent = fmtDur(left); const C=2*Math.PI*120; rp.setAttribute('stroke-dashoffset', C*(1-left/rest.total)); } }
  }
}, 250);
let actx=null;
function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); [0,.22].forEach(t=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.value=.18; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.15); }); }catch(e){} }
function tick(bi, ii, si){
  const s = S.session, b = s.blocks[bi], it = b.items[ii], z = it.sets[si];
  z.done = !z.done; ls.set('serie.session', s);
  if(!z.done){ render(); return; }

  const roundEnd = ii === b.items.length-1 || b.items.slice(ii+1).every(x=>!x.sets[si] || x.sets[si].done);
  if(blockDone(b)){
    const nb = s.blocks[bi+1];
    if(nb){ s.idx = bi+1; ls.set('serie.session', s); startRest(it.rest, 'Próximo: '+nb.items.map(x=>x.name).join(' + ')); window.scrollTo(0,0); }
    else { render(); toast('Último exercício feito! Toque em Terminar.'); return; }
  } else if(roundEnd){
    const nz = b.items[0].sets.find(x=>!x.done) ? b.items[0] : it; const ns = nz.sets.find(x=>!x.done);
    startRest(it.rest, ns ? 'Próxima: '+(b.items.length>1?b.items[0].name+' · ':'')+'série '+(nz.sets.indexOf(ns)+1)+' · '+(ns.load||0)+' kg × '+ns.reps : '');
  }
  render();
}

function finishFlow(){ go('finish', {endAt: Date.now()}); }
function sessionStats(s, endAt){
  const items = s.blocks.flatMap(b=>b.items);
  const done = items.flatMap(it=>it.sets.filter(z=>z.done));
  const exDone = items.filter(it=>it.sets.some(z=>z.done)).length;
  const reps = done.reduce((a,z)=>a+(num(z.reps)||0),0);
  const dur = Math.max(0,(endAt-s.startedAt)/1000);
  let bw = num(S.profile && S.profile.weight) || 75;
  const kcal = Math.round(5 * bw * dur/3600);
  return { items, exTotal: items.length, exDone, sets: done.length, setsTotal: items.reduce((a,it)=>a+it.sets.length,0), reps, dur, kcal, bw, vol: Math.round(volume(s)) };
}
const hm = t => { const d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); };

  '<label class="check"><input type="checkbox" id="upd" checked> Usar as cargas de hoje como base do próximo treino</label>')+

function volume(s){ return s.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+it.sets.filter(z=>z.done).reduce((y,z)=>y+(num(z.load)||0)*(num(z.reps)||0),0),0),0); }
async function finishOk(){

  if(upd){
    const p = findPlan(s.planId), d = findDay(p, s.dayId);
    if(d){ let changed=false; s.blocks.forEach(b=>b.items.forEach(it=>{ if(it.scheme) return; const done = it.sets.filter(z=>z.done && num(z.load)!=null); if(!done.length) return; const mx = Math.max(...done.map(z=>num(z.load)));
      d.blocks.forEach(pb=>pb.items.forEach(pi=>{ if(pi.id===it.key){ const old = num(pi.load); if(old!==mx){ pi.load = old==null ? mx+'kg' : String(pi.load).replace(/-?\d+([.,]\d+)?/, String(mx)); changed=true; } } })); }));
      if(changed) savePlans(); }
  }
  $('#layer').innerHTML=''; rest=null; try{ wakeLock && wakeLock.release(); }catch(e){}
  S.session = null; ls.del('serie.session');
  await saveSession(h);
  S.stack = [{v:'home'},{v:'progress'},{v:'session', id:h.id}]; render(); window.scrollTo(0,0);
  toast('Treino salvo 💪');
}

function chartSVG(pts){
  const W=320,H=170,P=26; const vs=pts.map(p=>p.v); let mn=Math.min(...vs), mx=Math.max(...vs); if(mn===mx){mn-=5;mx+=5;}
  const x=i=> pts.length===1 ? W/2 : P+(W-2*P)*i/(pts.length-1), y=v=> H-P-(H-2*P)*(v-mn)/(mx-mn);
  const line = pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><line x1="'+P+'" x2="'+(W-P)+'" y1="'+(H-P)+'" y2="'+(H-P)+'" stroke="#E7E5E4"/>'+
    '<path d="'+line+'" fill="none" stroke="#E8291C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="4.5" fill="#fff" stroke="#E8291C" stroke-width="2.5"/>'+(i===pts.length-1||i===0?'<text x="'+x(i)+'" y="'+(y(p.v)-10)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#111">'+p.v+'</text>':'')+'<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="#78716C">'+fmtDate(p.date).slice(0,5)+'</text>').join('')+'</svg>';
}

function genPlan({goal='Hipertrofia', freq=4, level='Iniciante', style='split'}){

  const nDays = full ? Math.min(freq, 4) : freq;
  const titles = WEEK[full ? Math.max(2, nDays) : freq];
  const days = [];
  for(let d=0; d<nDays; d++){
    const layout = full ? FULL : SPLITS[freq][d];
    const variation = full ? d : (freq===6 && d>=3 ? 1 : 0);
    const items = [];
    layout.forEach(([g,n]) => pickEx(g, level, n, variation).forEach(e => {
      const [sets, reps, rest] = cfg[e[2]==='c'?'c':'i'][lv];
      items.push({ id: uid(), exId: e[1], name: e[0], sets: String(e[1]==='Plank'?3:sets), reps: e[1]==='Plank' ? '30-45s' : String(reps), load:'', rest:String(rest), notes:'' });
    }));
    if(items.length){ items[0].notes = 'Aquecimento: 1 série leve de 12–15 reps antes.'; }
    if(cfg.cardio) items.push({ id:uid(), exId:'Walking_Treadmill', name:'Cardio', sets:'1', reps:'20 min', load:'', rest:'0', notes:'Esteira inclinada, bike ou elíptico. Ritmo em que dá pra falar, mas com esforço.' });
    let blocks;
    if(cfg.pairs){ blocks=[]; for(let k=0;k<items.length;k+=2) blocks.push({ id:uid(), items: items.slice(k,k+2) }); }
    else blocks = items.map(it => ({ id:uid(), items:[it] }));

function matchExercise(name, en){
  if(!LIB) return null;
  const ids = new Set(LIB.map(e=>e.id));
  const n = norm(name);
  for(const g of Object.values(EXDB)) for(const e of g) if(norm(e[0])===n) return e[1];
  if(en){ const ne = norm(en); const exact = LIB.find(e=>norm(e.name)===ne); if(exact) return exact.id;
    const tk = new Set(ne.split(' ').filter(w=>w.length>2)); let best=null, bs=0;
    for(const e of LIB){ const et = norm(e.name).split(' ').filter(w=>w.length>2); if(!et.length) continue; const inter = et.filter(w=>tk.has(w)).length; const sc = inter/Math.max(tk.size, et.length); if(sc>bs){ bs=sc; best=e.id; } }
    if(bs>=0.5) return best; }
  for(const [k,v] of PT_ALIAS) if(n.includes(k) && ids.has(v)) return v;
  return null;
}

async function authSubmit(){
  const st = cur(); const email = $('#a-email').value.trim(); const passEl = $('#a-pass'); const pass = passEl ? passEl.value : '';
  st.email = email; st.err = st.msg = ''; st.busy = true; keepForm(()=>render());
  try{
    if(st.mode === 'forgot'){
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if(error) throw error; st.msg = 'Se esse e-mail tiver conta, o link chega em instantes.';
    } else {
      if(pass.length < 6) throw new Error('A senha precisa ter pelo menos 6 caracteres.');
      const r = st.mode === 'up' ? await sb.auth.signUp({ email, password: pass, options:{ emailRedirectTo: location.origin + location.pathname } }) : await sb.auth.signInWithPassword({ email, password: pass });
      if(r.error) throw r.error;
      if(st.mode === 'up' && r.data.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0){ st.err = 'Esse e-mail já tem conta. Toque em Entrar.'; st.mode='in'; }
      else if(!r.data.session){ st.msg = 'Conta criada, mas precisa confirmar: abra o e-mail do Supabase (veja o spam), toque no link e depois volte aqui e toque em Entrar.'; st.mode='in'; }
      else { user = r.data.session.user; st.busy=false; S.loaded=false; await loadAll(); return; }
    }
  }catch(e){
    const m = String(e.message||e);
    st.err = /Invalid login/i.test(m) ? 'E-mail ou senha incorretos.' : /already registered/i.test(m) ? 'Esse e-mail já tem conta. Use Entrar.' : /Email not confirmed/i.test(m) ? 'Confirme seu e-mail pelo link que enviamos.' : /Failed to fetch|network/i.test(m) ? 'Sem internet.' : /valid password|Password should/i.test(m) ? 'A senha precisa ter pelo menos 6 caracteres.' : /rate limit|too many/i.test(m) ? 'Muitas tentativas. Espere um minuto e tente de novo.' : m;
  }
  st.busy = false; keepForm(()=>render());
}

document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(stop && el.dataset.act==='closeLayer' && !stop.contains(el)===false && el.classList.contains('modal')) return;
  if(el.classList.contains('modal') && e.target !== el) return;
  const a = el.dataset.act, D = el.dataset;
  const st = cur();
  switch(a){
    case 'back': if(['editDay','editPlan'].includes(st.v)) S.editDraft=null; backTo(); break;
    case 'home': home(); break;
    case 'go': { const p={}; if(D.plan) p.plan=D.plan; if(D.day) p.day=D.day; if(D.id) p.id=D.id; if(D.v===cur().v && !D.plan && !D.id && !cur().cat && !cur().q){ return; } $('#layer').innerHTML=''; if(['plans','progress'].includes(D.v)) S.stack=[{v:'home'}]; go(D.v,p); break; }
    case 'resume': S.stack=[{v:'home'},{v:'live'}]; render(); keepAwake(); break;
    case 'start': startSession(D.plan, D.day); break;
    case 'viewEx': if(!D.ex){ toast('Este exercício ainda não tem vídeo'); break; } loadLib().then(()=>viewer(D.ex, D.name, D.notes)); break;
    case 'closeLayer': $('#layer').innerHTML=''; confirmCb=null; break;
    case 'confirmOk': { const cb=confirmCb; $('#layer').innerHTML=''; confirmCb=null; cb&&cb(); break; }
    case 'tick': tick(+D.b, +D.i, +D.s); break;
    case 'adj': { const it=S.session.blocks[+D.b].items[+D.i], z=it.sets[+D.s]; const f=D.f, d=+D.d; let v=num(z[f])||0;
      if(f==='load'){ const step = v>=20 ? 2.5 : 1; v=Math.max(0, Math.round((v+d*step)*10)/10); z.load=String(v); if(!it.scheme) it.sets.forEach((x,k)=>{ if(k>+D.s && !x.done) x.load=String(v); }); }
      else { v=Math.max(0,v+d); z.reps=String(v); }
      ls.set('serie.session', S.session); st.keepScroll=true; render(); break; }
    case 'liveGo': { const i=+D.i; if(S.session && i>=0 && i<S.session.blocks.length){ S.session.idx=i; ls.set('serie.session', S.session); render(); window.scrollTo(0,0); } break; }
    case 'pickDay': pickDaySheet(); break;

    case 'restSkip': rest=null; { const t=$('#rest'); t&&t.remove(); } break;
    case 'finish': finishFlow(); break;
    case 'finishOk': finishOk(); break;
    case 'discard': { const empty = S.session && !S.session.blocks.some(b=>b.items.some(it=>it.sets.some(z=>z.done))); const go_=()=>{ S.session=null; rest=null; ls.del('serie.session'); try{ wakeLock && wakeLock.release(); }catch(e){} home(); }; empty ? go_() : confirmBox('Descartar este treino? As séries marcadas não vão pro histórico.', go_, 'Descartar', true); break; }
    case 'delSession': confirmBox('Apagar este registro do histórico?', async ()=>{ await deleteSession(D.id); backTo(); }, 'Apagar', true); break;
    case 'selProg': st.sel = D.n; render(); break;
    case 'libCat': go('library', {cat:D.c, pick:st.pick, b:st.b, i:st.i}); break;
    case 'libEq': st.eq = D.e; st.lim=40; render(); break;

function moveItem(bi, ii, dir){
  const bs=S.editDraft.blocks, b=bs[bi];
  if(b.items.length>1){ const j=ii+dir; if(j>=0 && j<b.items.length){ [b.items[ii],b.items[j]]=[b.items[j],b.items[ii]]; return; } }
  const nb=bi+dir; if(nb<0||nb>=bs.length) return;
  if(b.items.length===1){ [bs[bi],bs[nb]]=[bs[nb],bs[bi]]; }
  else { const it=b.items.splice(ii,1)[0]; bs.splice(dir>0?bi+1:bi,0,{id:uid(),items:[it]}); }
}

  if(t.id==='impTxt'){ st.txt=t.value; return; }
  if(t.id==='libq'){ st.q=t.value; st.lim=40; st.focus=true; clearTimeout(t._d); t._d=setTimeout(()=>render(),200); return; }
  if(t.dataset.in && S.session){ S.session.blocks[+t.dataset.b].items[+t.dataset.i].sets[+t.dataset.s][t.dataset.in]=t.value; ls.set('serie.session', S.session);
    // propagate load to following unchecked sets
    if(t.dataset.in==='load' && !S.session.blocks[+t.dataset.b].items[+t.dataset.i].scheme){ const it=S.session.blocks[+t.dataset.b].items[+t.dataset.i]; it.sets.forEach((z,si)=>{ if(si>+t.dataset.s && !z.done){ z.load=t.value; const inp=document.querySelector('input[data-in="load"][data-b="'+t.dataset.b+'"][data-i="'+t.dataset.i+'"][data-s="'+si+'"]'); if(inp) inp.value=t.value; } }); }
    return; }
  if(t.dataset.pf && S.editDraft){ S.editDraft[t.dataset.pf]=t.value; return; }
  if(t.dataset.df && S.editDraft){ S.editDraft.days[+t.dataset.i][t.dataset.df]=t.value; return; }
});


// preserva o que foi digitado quando re-renderiza formulários
function keepForm(fn){ const vals = {}; document.querySelectorAll('#app input[id]').forEach(i=>vals[i.id]=i.value); fn(); Object.entries(vals).forEach(([k,v])=>{ const i=document.getElementById(k); if(i) i.value=v; }); }
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id==='authf') authSubmit();
  if(e.target.id==='newpassf'){ const v=$('#np').value; sb.auth.updateUser({password:v}).then(r=>{ if(r.error){ cur().err=r.error.message; render(); } else { toast('Senha atualizada'); loadAll(); } }); }
});
document.addEventListener('change', e => { if(e.target.dataset && e.target.dataset.act==='selProgSel'){ cur().sel = e.target.value; cur().keepScroll=true; render(); } });
let tsx=null, tsy=null;
document.addEventListener('touchstart', e => { if(e.target.closest('#lvpage') && !e.target.closest('input')){ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; } else tsx=null; }, {passive:true});
document.addEventListener('touchend', e => { if(tsx==null || !S.session) return; const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy; tsx=null; if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5){ const i=(S.session.idx||0)+(dx<0?1:-1); if(i>=0 && i<S.session.blocks.length){ S.session.idx=i; ls.set('serie.session', S.session); render(); window.scrollTo(0,0); } } }, {passive:true});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update());
loadLib();
initData();
})();
</script>
